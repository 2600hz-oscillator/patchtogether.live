# Taskfile.yml — single command surface for patchtogether.live. See docs/adr/ for architecture decisions.
# Usage:
#   task            # list available tasks
#   task dev        # start dev server + DSP watch
#   task ai:check   # AI-friendly smoke check (concise pass/fail output)
#
# Every command runs inside the Flox env (which provides Node, Faust, esbuild,
# git-lfs, go-task itself). Run `flox activate` once per shell, or use
# `flox activate -- task <name>` to one-shot.

version: '3'

vars:
  WEB: packages/web
  DSP: packages/dsp
  SERVER: packages/server
  ART: art
  E2E: e2e

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  actionlint:
    desc: Lint GitHub Actions workflows locally (same pinned binaries + flags as CI) — run before pushing any .github/workflows change
    vars:
      AL_VER: 1.7.12
      AL_BIN: node_modules/.cache/actionlint/actionlint
    cmds:
      - |
        set -euo pipefail
        if [ ! -x "{{.AL_BIN}}" ]; then
          mkdir -p "$(dirname "{{.AL_BIN}}")"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=amd64; [ "$ARCH" = "aarch64" ] && ARCH=arm64
          # --retry-all-errors is load-bearing: curl does NOT retry a 503 without
          # it (a 503 is a valid HTTP response, not a transport error). Keep in
          # sync with ci.yml's actionlint job — see #1534.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v{{.AL_VER}}/actionlint_{{.AL_VER}}_${OS}_${ARCH}.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C "$(dirname "{{.AL_BIN}}")" actionlint
        fi
        # SHELLCHECK INTEGRATION IS ON (#1504). It used to be disabled with a
        # bare `-shellcheck=`, which meant the embedded shell in every `run:`
        # block — the scripts that decide what gates and what deploys — was
        # checked for GitHub Actions syntax only. Turning it on surfaced six
        # real findings across the workflow tree; they are fixed, and the
        # integration now stays on so the seventh is caught on arrival.
        # actionlint substitutes GitHub expressions before handing each body to
        # shellcheck, so the run blocks are checked as shell rather than as
        # templates. Keep in sync with ci.yml's actionlint job.
        # (Do NOT write a GitHub expression literally in this file — go-task
        # parses double braces as its own template action and fails the task.)
        PATH="$(bash scripts/lint/install-shellcheck.sh):$PATH"
        export PATH
        "{{.AL_BIN}}"

  # ---------------- Setup ----------------
  install:
    desc: Install all workspace dependencies
    cmds:
      - npm install

  install:browsers:
    desc: Install Playwright Chromium binary
    cmds:
      - npx --workspace {{.E2E}} playwright install chromium

  setup:
    desc: One-shot setup — npm install + Playwright browser
    cmds:
      - task: install
      - task: install:browsers

  setup:standalone:
    desc: |
      One-shot ONLINE prep for the offline-standalone-demo flow (see README
      "Run locally as a standalone demo"): npm install + DSP build + best-effort
      fetch of the DOOM shareware WAD. After this completes you can disconnect
      the network and run `task dev` — the public canvas at `/` works offline.
      DOOM module needs the WASM (run `bash packages/web/native/build-doom-wasm.sh`
      while still online — requires emcc on PATH).
    cmds:
      - task: install
      - task: dsp:build
      # Fetch the DOOM shareware WAD if it isn't already there. Best-effort —
      # if the mirror is down or the user is already offline, skip with a hint
      # rather than fail the whole setup. The DOOM module overlay handles the
      # missing-WAD case at runtime.
      - |
        WAD=packages/web/static/doom/DOOM1.WAD
        if [ -f "$WAD" ]; then
          echo "[setup:standalone] DOOM1.WAD already present, skipping fetch"
        else
          echo "[setup:standalone] fetching DOOM1.WAD shareware (4.2 MB) ..."
          if curl -fL --max-time 30 -o "$WAD" https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad; then
            echo "[setup:standalone] DOOM1.WAD ok"
          else
            echo "[setup:standalone] DOOM1.WAD fetch failed — DOOM module will show 'asset missing' offline. See packages/web/static/doom/DOWNLOAD_INSTRUCTIONS.md to fetch manually."
            rm -f "$WAD"
          fi
        fi
  setup:blood:
    desc: 'Install FULL-GAME Blood DATA (BLOOD.RFF + TILES*.ART + RFF/DAT/MAP) from a copy you own into packages/web/static/blood/, to play all episodes. NOT required to run the BLOOD module: the 1997 shareware subset (episode 1) is BUNDLED + committed, so the card boots out-of-box — this task is the OVERRIDE. It copies OVER the bundled shareware, and the shareware filenames are TRACKED (see the warning it prints). Full-game data is never shipped. Provenance + legal status: docs/adr/007-game-asset-distribution.md. Usage: `task setup:blood BLOOD_ASSETS=/path/to/your/blood/install` — defaults to ~/blood.'
    vars:
      BLOOD_ASSETS: '{{.BLOOD_ASSETS | default "~/blood"}}'
    cmds:
      - mkdir -p packages/web/static/blood
      - |
        # Expand ~ manually — Taskfile's shell doesn't always do it.
        SRC="{{.BLOOD_ASSETS}}"
        SRC="${SRC/#\~/$HOME}"
        if [ ! -d "$SRC" ]; then
          echo "BLOOD: asset directory not found at $SRC"
          echo "       Pass BLOOD_ASSETS=/path/to/your/blood/install explicitly, or put your"
          echo "       Blood install (with BLOOD.RFF) at ~/blood and re-run \`task setup:blood\`."
          echo "       You do NOT need this to run the BLOOD module — the 1997 shareware"
          echo "       (episode 1) is bundled + committed and the card boots out-of-box."
          echo "       This task is the FULL-GAME override (all episodes), from a copy you own."
          echo "       Provenance + legal status: docs/adr/007-game-asset-distribution.md."
          exit 1
        fi
        # BLOOD.RFF is the required anchor file — fail clearly if it's absent
        # (case-insensitive: DOS releases ship uppercase, some installs lowercase).
        RFF="$(find "$SRC" -maxdepth 2 -iname 'BLOOD.RFF' | head -1)"
        if [ -z "$RFF" ]; then
          echo "BLOOD: no BLOOD.RFF found under $SRC — that's the required main resource file."
          echo "       Make sure BLOOD_ASSETS points at an extracted Blood install (e.g. the"
          echo "       One Unit Whole Blood / Fresh Supply DOS data). See static/blood/README.md."
          exit 1
        fi
        BASE="$(dirname "$RFF")"
        DEST=packages/web/static/blood
        echo "BLOOD: found data dir $BASE"
        # Copy the recognised Blood data files (case-insensitive). We DON'T copy
        # the whole dir — only the known game-data extensions — to avoid pulling
        # in EXEs / config / saves.
        copied=0
        COPIED=""
        while IFS= read -r f; do
          cp "$f" "$DEST/"
          echo "BLOOD:   + $(basename "$f")"
          COPIED="$COPIED $DEST/$(basename "$f")"
          copied=$((copied+1))
        done < <(find "$BASE" -maxdepth 1 -type f \( \
          -iname '*.RFF' -o -iname '*.ART' -o -iname '*.DAT' -o -iname '*.MAP' \))
        echo "BLOOD: installed $copied data file(s) → $DEST"
        # The bundled 1997 shareware filenames are TRACKED (un-ignored in
        # .gitignore, LFS — ADR-007), so copying a full-game file over one of
        # them is a MODIFIED tracked file, NOT an ignored local copy. Ask git
        # which ones rather than restating the set here, so this can't drift.
        # Scoped to the paths WE just wrote — asking about $DEST as a whole
        # would also report an unrelated edit (e.g. to README.md) as ours.
        DIRTY=""
        [ -n "$COPIED" ] && DIRTY="$(git status --porcelain -- $COPIED | awk '{print $NF}')"
        if [ -n "$DIRTY" ]; then
          echo "BLOOD: ⚠ you overwrote TRACKED bundled shareware file(s) — do NOT commit these:"
          printf 'BLOOD:   %s\n' $DIRTY
          echo "BLOOD:   restore the bundled shareware with: git checkout -- $DEST"
        fi
        echo "BLOOD: any file NOT in the bundled set (TILES000.ART, *.MAP, …) is .gitignored."
        echo "BLOOD: full-game Blood data is Warner Bros. IP — never commit or redistribute it."
        echo "BLOOD: what ships in-repo and why: docs/adr/007-game-asset-distribution.md"

  # ---------------- Dev loop ----------------
  dev:
    desc: Start SvelteKit dev server (DSP built once up-front; use dev:full for live Faust watch)
    deps: [dsp:build, docs:ensure]
    cmds:
      - npm run dev -w {{.WEB}}

  dev:full:
    desc: Dev server with DSP file watcher running in parallel
    deps: [dsp:build, docs:ensure]
    cmds:
      - |
        npm run watch -w {{.DSP}} &
        WATCHER_PID=$!
        trap "kill $WATCHER_PID 2>/dev/null" EXIT
        npm run dev -w {{.WEB}}

  server:dev:
    desc: Start the Hocuspocus collaboration server (Stage B). Defaults to ws://localhost:1235 (1234 conflicts with BitwigStudio + DAWs that reserve it for OSC).
    cmds:
      - npm run dev -w {{.SERVER}}

  server:build:
    desc: Compile the Hocuspocus server to packages/server/dist
    cmds:
      - npm run build -w {{.SERVER}}

  # ---------------- Build ----------------
  build:
    desc: Production build (DSP + web)
    cmds:
      - task: dsp:build
      - task: docs:faces
      - task: docs:ensure
      - npm run build -w {{.WEB}}
      # Same silent-prerender-skip guard as build:web (this task INLINES the
      # web build rather than calling build:web, so it needs its own line).
      - node {{.WEB}}/scripts/check-prerender.mjs

  build:web:
    desc: Build web only
    cmds:
      - task: docs:faces
      - task: docs:ensure
      - npm run build -w {{.WEB}}
      # Postbuild guard: the prerenderer can skip '/' SILENTLY (2026-07-11 —
      # an intermittent empty-shell index.html surfaced an hour later as the
      # landing-routing raw-HTML e2e red on #1059, with both Playwright
      # attempts reusing the same bad artifact and no build-side trail).
      # Fail THE BUILD loudly instead. Lives here rather than the web
      # package.json build script because packages/web/package.json is a
      # WebGL-attest toolchain pin — a script edit there forces a GPU
      # re-attest.
      - node {{.WEB}}/scripts/check-prerender.mjs

  # ---------------- DSP ----------------
  dsp:build:
    desc: Compile Faust + JS worklets to packages/dsp/dist
    # Skip the (slow) Faust compile when a matching dist is already on disk.
    # `status:` short-circuits the task when ALL listed commands exit 0:
    #   - dist/.dsp-srchash exists, AND
    #   - its content == the current hash of all DSP build inputs.
    # In CI the `dsp-build` job compiles once and uploads packages/dsp/dist/**
    # (incl. .dsp-srchash); every downstream job restores that artifact, so a
    # job calling `task art|vrt|vrt:strict|build` (which all list dsp:build as a
    # dep) REUSES the restored dist instead of recompiling Faust ~16× per run.
    # Locally it makes back-to-back `task vrt` / `task art` runs instant after
    # the first build. Edit any DSP source / build script / the flox manifest
    # and the hash changes → the guard fails → a real rebuild runs.
    status:
      - test -f {{.DSP}}/dist/.dsp-srchash
      - test "$(cat {{.DSP}}/dist/.dsp-srchash 2>/dev/null)" = "$(bash scripts/dsp-src-hash.sh)"
    cmds:
      - npm run build -w {{.DSP}}
      # Stamp the source fingerprint so a later `task` invocation (or a CI job
      # that restored this dist) can skip the rebuild via the `status:` guard.
      - bash scripts/dsp-src-hash.sh > {{.DSP}}/dist/.dsp-srchash

  dsp:watch:
    desc: Watch packages/dsp/src and rebuild on save
    cmds:
      - npm run watch -w {{.DSP}}

  dsp:fetch-dist:
    desc: |
      [local dev-loop] Populate packages/dsp/dist by COPYING a prebuilt dist from
      the primary checkout (or a sibling worktree, or $DSP_DIST_SRC) instead of
      compiling Faust. For fresh worktrees / envs without the Faust toolchain so
      single-test runs (e2e/vrt/art) don't fail on a missing DSP bundle. Never
      runs in CI; the normal `task dsp:build` path is unchanged.
    cmds:
      - bash scripts/dsp-fetch-dist.sh

  dsp:ensure:
    desc: |
      [local dev-loop] Make sure packages/dsp/dist exists with the LEAST work:
      reuse a current dist via the dsp:build status-guard if possible; otherwise
      compile with Faust if available; otherwise fall back to copying a prebuilt
      dist (dsp:fetch-dist). Used by the single-test targets so they never fail on
      a missing/uncompilable DSP bundle.
    cmds:
      - |
        # Fast path: a current dist already satisfies the dsp:build status guard.
        if [ -f {{.DSP}}/dist/.dsp-srchash ] \
           && [ "$(cat {{.DSP}}/dist/.dsp-srchash 2>/dev/null)" = "$(bash scripts/dsp-src-hash.sh)" ]; then
          echo "[dsp:ensure] dist is current — nothing to do"
          exit 0
        fi
        # Prefer a real Faust build when the toolchain is present.
        if command -v faust >/dev/null 2>&1 \
           && [ -f node_modules/@grame/faustwasm/scripts/faust2wasm.js ]; then
          echo "[dsp:ensure] Faust available — building dist"
          task dsp:build
        else
          echo "[dsp:ensure] Faust unavailable — copying a prebuilt dist"
          task dsp:fetch-dist
        fi

  # ---------------- Type check / lint ----------------
  typecheck:
    desc: Type-check every workspace
    # docs:ensure first: svelte-check must resolve the GENERATED (gitignored)
    # module-docs.generated.ts import in module-manifest.ts / Canvas.svelte,
    # which doesn't exist on a fresh checkout.
    deps: [docs:ensure]
    cmds:
      - npm run typecheck --workspaces --if-present

  lint:
    desc: Lint TS/Svelte (ESLint) + shell (ShellCheck). The real gate — see #1504.
    cmds:
      - task: lint:eslint
      - task: lint:shell

  lint:eslint:
    desc: |
      ESLint over the whole tree (TS + Svelte + JS). FAILS on any finding from a
      rule that is not NAMED in STAGED_RULES, on a staged entry that no longer
      has findings (the debt is paid — delete it), on a stale ignore entry, and
      on its own controls. Config: eslint.config.mjs. Policy: scripts/lint/lint-policy.mjs.
    cmds:
      - node scripts/lint/eslint-gate.mjs

  lint:waits:accept:
    desc: |
      Regenerate e2e/waitfortimeout-ledger.generated.txt — the outstanding
      population of the #1523 waitForTimeout burn-down. Run it after converting
      or annotating waits, then REVIEW THE DIFF: every removed line should be a
      wait you turned into a frame count, a predicate, or an annotated
      product-side interval. It REFUSES to add a line, so the artifact can only
      shrink; a new un-annotated wait is a `task lint` failure, not a ledger entry.
    cmds:
      - node scripts/lint/wait-ledger-accept.mjs

  lint:shell:
    desc: |
      ShellCheck over every tracked *.sh at the strictest severity. ZERO findings
      permitted — exemptions are per-instance `# shellcheck disable=SCxxxx # why: ...`
      directives, never a file-level opt-out. Workflow `run:` blocks are covered
      separately by `task actionlint`, which now runs WITH the shellcheck integration.
    cmds:
      - |
        set -euo pipefail
        SHELLCHECK_BIN="$(bash scripts/lint/install-shellcheck.sh)/shellcheck"
        export SHELLCHECK_BIN
        node scripts/lint/shellcheck-gate.mjs

  # ---------------- Unit + integration tests ----------------
  test:
    desc: Run unit/integration tests (dsp + server + web — ART + E2E are run via dedicated tasks)
    # NOTE: deliberately scoped to dsp + server + web. Using
    # `npm test --workspaces --if-present` would also invoke `art` (vitest) and
    # `e2e` (playwright), which are heavier suites with their own task targets
    # — and `task ci` would then run them twice. See chore/build-perf PR.
    #
    # dsp's `test` target runs the pure-lib unit suite (e.g. cube-dsp.test.ts);
    # it has its own vitest.config.ts (node env, no AudioContext/WASM). Older
    # DSP-lib tests still live under web/ via relative import — both run.
    #
    # NO side effects on the working tree (#1526). This used to emit
    # e2e/.generated/registry-manifest.json as a side effect of a unit test;
    # generation is now the explicit `task test:emit-manifest` target, which
    # every lane that READS the manifest declares as a dep.
    #
    # test:present-shell is NOT reached by any `-w` / `--workspaces` form:
    # present-shell is deliberately not an npm workspace, so it has to be named
    # here or it is in no lane at all (#1496).
    cmds:
      - npm test -w {{.DSP}}
      - npm test -w {{.SERVER}}
      - npm test -w {{.WEB}}
      - task: test:present-shell
      - task: test:scripts

  test:present-shell:
    desc: Run packages/present-shell's node:test suite (the package is deliberately NOT an npm workspace)
    # WHY THIS TARGET EXISTS AT ALL. present-shell (the Electron kiosk shell for
    # multi-projector venues) is deliberately absent from root `workspaces`: its
    # `electron` devDependency postinstalls a ~107 MB platform binary that
    # ci.yml's ~/.npm + ms-playwright cache does not cover, and root install runs
    # in every CI job. That exclusion was right; the consequence was not —
    # `npm test --workspaces` never reached it, so its parse-features tests had
    # never run in CI since the package landed (#1496).
    #
    # Its tests are pure `node:test` + `node:assert` against a dependency-free
    # .cjs module, so they run here with NOTHING installed — the package stays
    # inside the required unit lane without the repo ever paying for electron.
    #
    # scripts/package-workspace-membership.test.ts asserts THIS file still names
    # the test entry point below, so renaming or dropping the line reddens the
    # unit lane rather than silently un-testing the package again.
    cmds:
      - node --test packages/present-shell/parse-features.test.cjs

  test:one:
    desc: |
      [local dev-loop] Run ONE vitest file (or -t name filter), fast, no full
      suite. Pass a path and/or a `-t <name>` after `--`. Defaults to the web
      package; set PKG=dsp|server|art|web to target another workspace.
      REPEAT=N runs it N times in a row and FAILS on the first failing run — the
      flake-check you owe any NEW/changed test before opening an MR (REPEAT=3 is
      the standard; see CLAUDE.md "Flake-check NEW tests 3×").
      Examples:
        task test:one -- src/lib/ui/canvas/organize.test.ts
        task test:one -- organize -t "deterministic"
        task test:one PKG=dsp -- cube     # PKG=… goes BEFORE the `--`
        REPEAT=3 task test:one -- organize    # flake-check: 3 clean runs required
    vars:
      PKG: '{{.PKG | default "web"}}'
    cmds:
      # `vitest run <positional>` treats a bare arg as a filename substring
      # filter, so passing either a path or a partial name Just Works. We add
      # the package's own config explicitly so the right env/alias is used.
      - |
        case "{{.PKG}}" in
          web)     DIR=packages/web    CFG=vitest.config.ts ;;
          dsp)     DIR=packages/dsp    CFG=vitest.config.ts ;;
          server)  DIR=packages/server CFG=vitest.config.ts ;;
          art)     DIR=art             CFG=vitest.config.ts ;;
          # repo-root scripts/ tooling tests (test-ledger, test-reconciliation,
          # new-module scaffolder) — run from root via the scripts config, no -w.
          scripts) DIR=.               CFG=vitest.scripts.config.ts ;;
          *) echo "test:one: unknown PKG '{{.PKG}}' (use web|dsp|server|art|scripts)"; exit 2 ;;
        esac
        # vitest has no native --repeat-each, so loop. REPEAT defaults to 1
        # (normal single run); REPEAT=3 is the pre-MR flake-check (exit on the
        # first failing run so a flake is never masked by a later green run).
        N="${REPEAT:-1}"
        for r in $(seq 1 "$N"); do
          [ "$N" -gt 1 ] && echo "[test:one] flake-check run $r/$N"
          echo "[test:one] $DIR vitest run {{.CLI_ARGS}}"
          if [ "{{.PKG}}" = scripts ]; then
            npx vitest run --config "$CFG" {{.CLI_ARGS}} \
              || { echo "[test:one] FAILED on run $r/$N (flake or real failure)"; exit 1; }
          else
            npm exec -w "$DIR" -- vitest run --config "$CFG" {{.CLI_ARGS}} \
              || { echo "[test:one] FAILED on run $r/$N (flake or real failure)"; exit 1; }
          fi
        done

  test:scripts:
    desc: Run repo-root scripts/ tests (scaffolder + future repo-wide tooling)
    # Uses vitest.scripts.config.ts (include: scripts/**/*.test.ts).
    # The scaffolder tests drive scaffold()/undo() against a throwaway FIXTURE
    # TREE (NEW_MODULE_REPO_ROOT), so this lane leaves the working copy clean.
    # It did NOT used to: undo() was a line short of byte-exact and every run
    # appended blank lines to modules-card-map.test.ts. Kept single-fork so
    # scripts tests don't race on shared temp state.
    #
    # NOTE: config file is NOT named vitest.config.ts on purpose — per-package
    # `vitest run` would auto-discover it and shadow the package's own config,
    # breaking `npm test -w packages/server`. See vitest.scripts.config.ts.
    #
    # DEP (#1526): ci-selection-audit.test.ts shells out to `playwright test
    # --list`, which parses every spec — and the registry-driven specs read
    # e2e/.generated/registry-manifest.json at parse time. This lane used to
    # work only because `npm test -w packages/web` ran EARLIER in `task test`
    # and emitted the manifest as a side effect: an ordering coupling between
    # two unrelated lanes, invisible in the task graph, and broken the moment
    # anyone ran `task test:scripts` on a fresh checkout. Declared instead.
    deps: [test:emit-manifest]
    cmds:
      - npx vitest run --config vitest.scripts.config.ts

  test:emit-manifest:
    aliases: [manifest:emit]
    desc: |
      [generate] Emit e2e/.generated/registry-manifest.json — the registry
      projection every registry-driven Playwright sweep iterates
      (per-module-per-port, behavioral, vrt.spec). THE ONLY producer.
      Declared as a dep by every lane that reads it.
    # #1526: the write used to be a SIDE EFFECT of `task test` — an
    # `it('emits the manifest JSON to disk')` that ran unconditionally. That
    # made the unit lane mutate the tree and hid generation from the task
    # graph. Generation now lives in `src/lib/dev/registry-manifest.ts`
    # (`emitRegistryManifest`) and the spec only calls it under MANIFEST_EMIT=1
    # — the same accept-loop shape as DOCS_UPDATE / FACE_INVENTORY_UPDATE.
    #
    # It still runs THROUGH vitest, and that is not laziness: the def barrels
    # resolve worklet `?url` / `.wasm` imports that exist only inside Vite, so
    # a plain `node --import tsx` cannot read the registry at all (see
    # scripts/propose-face.ts's header, which parses def SOURCE for exactly
    # this reason). vitest's fork pool is the only Node context that can. The
    # `docs:ensure` seam is the same trade.
    #
    # Runs from packages/web so vitest's include glob (`src/**/*.test.ts`
    # relative to the config) resolves the spec file correctly.
    dir: '{{.WEB}}'
    env:
      MANIFEST_EMIT: '1'
    cmds:
      - npx vitest run src/lib/dev/registry-manifest.test.ts

  test:ledger:
    desc: |
      Test ledger — CHECK the generated 3-bucket punch-list
      (docs/testing/test-ledger.generated.md) against a fresh regeneration,
      read-only (the same freshness gate CI runs in the `unit` lane). Fails
      if the committed artifact is stale. Prose + roadmap: docs/testing/README.md.
    cmds:
      - npx vitest run --config vitest.scripts.config.ts test-ledger

  test:ledger:accept:
    desc: |
      [accept-loop] Re-pin the GENERATED test ledger
      (docs/testing/test-ledger.generated.md) from the current source tree —
      run after an INTENTIONAL new skip / exemption / CI-lane change, then
      review the git diff before committing (a diff = the punch-list moved:
      accept it, or recognize a bug). The ART/VRT *:update analog for the ledger.
    cmds:
      - LEDGER_UPDATE=1 npx vitest run --config vitest.scripts.config.ts test-ledger
      - 'echo "[test:ledger:accept] re-pinned docs/testing/test-ledger.generated.md — review the git diff before committing"'

  face:inventory:
    desc: |
      Face-migration inventory (LEG-01) — run the RATCHET: every registered
      module carries exactly one disposition, the done-set IS STRICT_FACES,
      blockers resolve both ways, and the generated progress artifact
      (docs/design/face-migration.generated.md) is fresh. Read-only; the same
      gate CI runs in the `unit` lane.
    dir: '{{.WEB}}'
    cmds:
      - npx vitest run src/lib/ui/workflow/face-migration-inventory.test.ts

  face:inventory:accept:
    desc: |
      [accept-loop] Re-pin the GENERATED face-migration progress artifact
      (docs/design/face-migration.generated.md) from the inventory record + the
      live registry — run after an INTENTIONAL disposition change or a new
      module, then review the git diff (a diff = the migration moved: accept it,
      or recognize a bug). The test-ledger analog for LEG-01.
    dir: '{{.WEB}}'
    cmds:
      - FACE_INVENTORY_UPDATE=1 npx vitest run src/lib/ui/workflow/face-migration-inventory.test.ts
      - 'echo "[face:inventory:accept] re-pinned docs/design/face-migration.generated.md — review the git diff before committing"'

  # ---------------- Audio Regression Tests ----------------
  art:
    desc: Run Audio Regression Tests
    deps: [dsp:build]
    cmds:
      - npm test -w {{.ART}}

  art:update:
    desc: |
      Regenerate ART baselines (.f32 + .sha) AND re-pin the fingerprint manifest.
      The two are ONE truth in two artifacts: re-pinning baselines without
      re-pinning packages/web/src/lib/art/fingerprints.generated.json leaves the
      manifest stale (#1174 did exactly that — green CI, red on every fresh local
      checkout). So the re-pin is chained here and CANNOT be forgotten. Review
      BOTH diffs before committing: a labels-only fingerprint move is a level
      change, a spectrum/features move is a timbral change.
    deps: [dsp:build]
    cmds:
      - npm run art:update -w {{.ART}}
      # Chained on purpose — see the desc above. Read-only over the .f32 set
      # (numpy, no render, ~0.2 s), so this is nearly free.
      - task: art:fingerprints:accept

  art:one:
    desc: |
      [local dev-loop] Run ONE ART scenario by file-path or name filter, fast.
      Uses dsp:ensure (copies a prebuilt dist on Faust-less worktrees) so it
      never fails on a missing DSP bundle. REPEAT=N runs it N times and fails on
      the first failing run (the pre-MR flake-check; REPEAT=3 is the standard).
      Examples:
        task art:one -- moog911
        task art:one -- scenarios/meowbox/meow-c4.test.ts
        task art:one -- -t "tracks 1V/oct"
        REPEAT=3 task art:one -- moog911    # flake-check: 3 clean runs required
    deps: [dsp:ensure]
    cmds:
      - |
        N="${REPEAT:-1}"
        for r in $(seq 1 "$N"); do
          [ "$N" -gt 1 ] && echo "[art:one] flake-check run $r/$N"
          npm exec -w {{.ART}} -- vitest run --config vitest.config.ts {{.CLI_ARGS}} \
            || { echo "[art:one] FAILED on run $r/$N (flake or real failure)"; exit 1; }
        done

  art:fingerprints:accept:
    desc: |
      [accept-loop] Re-pin the ART fingerprint manifest
      (packages/web/src/lib/art/fingerprints.generated.json) — the ART "Spectral
      Column Print" GENERATED/PINNED artifact (the ART analog of docs:accept).
      Read-only over the committed art/baselines/**/*.f32 (numpy only, NO audio
      render). Run AFTER an INTENTIONAL baseline/compute change, then ALWAYS
      review `git diff` of the manifest before committing (a diff means the
      baselines or the fingerprint compute changed — accept it, or recognize a
      bug). Never hand-edit the manifest.
    cmds:
      - python3 art/build_gallery.py
          --baseline-dir art/baselines
          --fingerprints-out {{.WEB}}/src/lib/art/fingerprints.generated.json
      - 'echo "[art:fingerprints:accept] re-pinned fingerprints.generated.json — review the git diff before committing"'

  art:fingerprints:check:
    desc: |
      Run the ART fingerprint DRIFT GATE read-only (byte-exact regen == committed)
      + the pure-fs consistency guard — the same checks the unit lane runs. The
      byte-exact gate skips cleanly when python3+numpy or the materialized .f32
      baselines are absent.
    cmds:
      - npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts fingerprints.check fingerprints.consistency

  # ---------------- Visual Regression Tests (Playwright VRT) ----------------
  # Baselines live under e2e/vrt/__screenshots__/ and are LFS-tracked (see
  # .gitattributes). Modeled on the doomviz VRT pattern — same gallery shape,
  # adapted to Playwright + TS. Initially non-blocking in CI (continue-on-error).
  vrt:
    desc: Run the VRT suite (Playwright; compares card screenshots against e2e/vrt/__screenshots__/). Full sweep — INFORMATIONAL lane (includes canvas-driven cards that may flake).
    # dsp:build is required because several module Card.svelte files
    # import `?url`-suffixed WASM artifacts from packages/dsp/dist/
    # (e.g. a def importing a sibling wasm?url asset). Without the
    # bundled DSP on disk Vite's dev server fails the import with a
    # 500 + an HMR overlay, which Playwright detects as a hung page
    # and the suite times out after 30s on every module.
    #
    # test:emit-manifest is required because vrt.spec.ts iterates the
    # registry manifest at file-parse time (e2e/tests/_registry.ts).
    # Without a fresh manifest on disk Playwright throws at test
    # discovery with an actionable error pointing back at this target.
    deps: [dsp:build, test:emit-manifest]
    cmds:
      - task: vrt:run
        vars: { SCRIPT: vrt, ARGS: '{{.CLI_ARGS}}' }

  vrt:strict:
    desc: Run the deterministic VRT subset (STRICT_VRT_MODULES) — pure knob/fader cards, no canvas masks. BLOCKING lane in `task ci`. A flake here is a real flake to fix, not tolerate (per memory `feedback_no_flake_tolerance`).
    # Same deps as `task vrt` — DSP bundle + registry manifest. The
    # filter to STRICT_VRT_MODULES happens inside vrt.spec.ts when
    # VRT_STRICT=1 is set (also narrows testMatch in vrt.config.ts so
    # the auxiliary composite/interactions/skin specs don't run).
    deps: [dsp:build, test:emit-manifest]
    env:
      VRT_STRICT: '1'
    cmds:
      - task: vrt:run
        vars: { SCRIPT: 'vrt:strict', ARGS: '{{.CLI_ARGS}}' }

  vrt:strict:plan:
    desc: |
      Print how the REQUIRED vrt-strict lane splits across shards, from MEASURED
      per-test cost (e2e/vrt-strict-timings.generated.json). Read this before
      changing the shard count in ci.yml — the answer is arithmetic, not a guess.
      Examples:
        task vrt:strict:plan          # the shard count ci.yml runs
        task vrt:strict:plan -- 6     # what 6 would buy
    cmds:
      - |
        set -eu
        N="{{.CLI_ARGS}}"
        if [ -z "$N" ]; then
          # DERIVED from the workflow, never re-typed: the plan you are shown is
          # the plan CI runs. Same expression scripts/vrt-shard-plan.test.ts uses.
          N=$(node -e 'const y=require("node:fs").readFileSync(".github/workflows/ci.yml","utf8");const m=/vrt-strict-shard:[\s\S]*?shard:\s*\[([0-9,\s]+)\]/.exec(y);if(!m){console.error("no vrt-strict-shard matrix in ci.yml");process.exit(1);}console.log(m[1].split(",").filter(s=>s.trim()).length)')
        fi
        node scripts/vrt-shard-plan.mjs --report "$N"

  vrt:strict:timings:accept:
    desc: |
      [accept] Refresh e2e/vrt-strict-timings.generated.json from a real CI run's
      per-shard timing artifacts, then REVIEW THE DIFF — a cost that moved a lot
      is a finding, not bookkeeping. The split is only as good as these numbers.
      Usage: task vrt:strict:timings:accept -- <ci-run-id>
    cmds:
      - node scripts/vrt-strict-timings-accept.mjs {{.CLI_ARGS}}

  e2e:timings:accept:
    desc: |
      [accept] Refresh e2e/e2e-timings.generated.json (the e2e shard planner's
      cost artifact, #1600) from a real ci.yml run's blob-report artifacts, then
      REVIEW THE DIFF — a cost that moved a lot is a finding, not bookkeeping.
      Costs only: contention classes are derived at plan time
      (scripts/e2e-contention-scan.mjs), never committed.
      Usage: task e2e:timings:accept -- <ci-run-id>
    cmds:
      - node scripts/e2e-timings-accept.mjs {{.CLI_ARGS}}

  vrt:run:
    internal: true
    desc: 'Internal: run an e2e-workspace vrt script with E2E_PORT honoured.'
    cmds:
      - |
        # ⚠ HONOUR E2E_PORT. `vrt.config.ts` reads `E2E_BASE_URL` with
        # `reuseExistingServer: true`, so an E2E_PORT-isolated worktree that did
        # not set E2E_BASE_URL ran the WHOLE SWEEP against whatever was already
        # serving the shared default port — in practice the primary checkout's
        # dev server, i.e. a DIFFERENT BRANCH. Measured 2026-08-09: a full
        # `E2E_PORT=5251 task vrt` came back 276 passed / 1 failed having never
        # once loaded the branch under test. That is worse than useless — it is
        # a green sweep that certifies someone else's code, and the result is
        # indistinguishable from a real one. `e2e:one` and `vrt:one` were both
        # fixed for exactly this; the full sweeps were not.
        # The default is now the PER-WORKTREE derived port (#1597) — the SAME
        # derivation every entry point uses (scripts/e2e-port.sh), so siblings
        # stop colliding at the source.
        PORT="$(bash scripts/e2e-port.sh)"
        E2E_BASE_URL="${E2E_BASE_URL:-http://localhost:$PORT}" \
          npm run {{.SCRIPT}} -w {{.E2E}} -- {{.ARGS}}

  vrt:update:
    desc: 'Refresh VRT baselines LOCALLY. ⚠ NOT the accept path: linux CI is the only baseline author, and a macOS render will differ from it. Use `task vrt:commit` to accept, or `task vrt:docker` for a pixel-exact local loop.'
    deps: [dsp:build, test:emit-manifest]
    cmds:
      # Same E2E_PORT hazard as `task vrt` (see `vrt:run`) — and strictly worse
      # here, because this one WRITES: an isolated worktree that regenerated
      # against 5173 would commit baselines captured from another branch.
      #
      # ⚠ `--update-snapshots=changed` lives HERE, not in e2e/package.json's
      # `vrt:update` script, and that is not a style choice: `e2e/package.json`
      # is a TOOLCHAIN_PIN_FILE in the WebGL attest basis
      # (scripts/webgl-attest-lib.ts — it pins @playwright/test, the renderer
      # version) and the basis hashes the file WHOLE. Editing one unrelated
      # script string moved the hash 620fa1b3… → ad300c3e… and turned
      # `webgl-attest` red, needing a trusted-machine GPU re-attest for a
      # one-word CLI flag. Keep behaviour changes to the npm scripts out of that
      # file. Bare `--update-snapshots` means `=all` in Playwright 1.59 and has
      # already rewritten 22 unrelated baselines once; `=changed` is what we
      # actually want, so it is passed BEFORE {{.CLI_ARGS}} and a caller can
      # still override it explicitly.
      - task: vrt:run
        vars:
          SCRIPT: vrt
          ARGS: '--update-snapshots=changed {{.CLI_ARGS}}'

  vrt:commit:
    desc: |
      [accept VRT changes — THE ONLY BASELINE AUTHOR] Trigger the vrt-update.yml
      CI job (workflow_dispatch) for THIS branch: regenerates the baselines on
      linux CI, commits them back to the branch, then close+reopens the PR so
      the required checks re-fire against the fresh ones.
      Devs never commit a baseline. There is ONE set and CI writes it — a local
      macOS render is a smoke test, not a capture. The loud VRT-diff PR comment
      points here for exactly that reason; inspect the diff gallery it links
      BEFORE accepting. (The `vrt` lane is INFORMATIONAL; `vrt-strict` gates.)

      SCOPED BY DEFAULT (#1795). A bare `task vrt:commit` DERIVES the capture
      grep from this branch's own diff and dispatches with it. MEASURED on
      2026-08-17: a scoped capture is ~3 min against 41-56 min unscoped, and the
      scoping capability existed the whole time — nothing chose it for you. The
      full sweep is still available and is now DELIBERATE (`ALL=1`), never a
      silent fallback. `scripts/vrt-scope.mjs` prints the scope it chose, the
      files that produced it, and how many of the discovered tests it selects,
      BEFORE the dispatch.
      Examples:
        task vrt:commit                       # derive the scope from the branch diff
        GREP=adsr   task vrt:commit           # scope by hand (single token)
        ALL=1       task vrt:commit           # deliberate FULL sweep
        task vrt:commit -- some-other-branch  # explicit branch override
    cmds:
      - |
        set -eu
        BRANCH="{{.CLI_ARGS}}"
        [ -n "$BRANCH" ] || BRANCH="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "HEAD" ]; then
          echo "Refusing to regenerate VRT baselines for '$BRANCH' — check out the PR branch first, or pass one: task vrt:commit -- <branch>." >&2
          exit 1
        fi
        # Normalize ONCE so every later reference is safe under `set -u`, and
        # use an if-block rather than `[ … ] && …` — a trailing test that
        # evaluates false makes the line exit non-zero, which under `set -e`
        # aborts the whole target. Both bugs were live: `task vrt:commit` with
        # no GREP set died on "GREP: unbound variable" before dispatching
        # anything, so the documented ONLY-baseline-author entry point did not
        # run at all and every capture went out as a hand-typed `gh` command.
        GREP="${GREP:-}"
        ALL="${ALL:-}"
        if [ -n "$GREP" ] && [ -n "$ALL" ]; then
          echo "GREP='$GREP' and ALL=1 ask for opposite things — pass one." >&2
          exit 1
        fi
        if [ -n "$ALL" ]; then
          echo "FULL SWEEP requested (ALL=1): every VRT spec, in ONE unsharded job (41-56 min, measured 2026-08-17)."
        elif [ -z "$GREP" ]; then
          # ── SCOPE IS DERIVED, NOT ASSUMED (#1795) ─────────────────────────
          # The script writes its report to stderr and exactly one machine-read
          # line to stdout. Exit 3 = "nothing on this branch can move a
          # baseline", which is a refusal to burn a runner, not an error — but
          # it still must not dispatch, so every non-zero code stops here.
          # `set +e` around the substitution because `set -e` would abort the
          # target before the code could be read, and the two outcomes need
          # different messages.
          set +e
          DECISION="$(node scripts/vrt-scope.mjs decide --branch "$BRANCH")"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          case "$DECISION" in
            'SCOPE '*) GREP="${DECISION#SCOPE }" ;;
            'FULL') GREP="" ;;
            *) echo "vrt:commit: unrecognized scope decision '$DECISION' from scripts/vrt-scope.mjs" >&2; exit 1 ;;
          esac
        fi
        # ⚠ ONE SHELL-SAFE TOKEN, always — derived or hand-passed. The capture
        # step runs `task vrt:update -- --grep "$GREP"`, and go-task joins
        # CLI_ARGS into a shell line UNQUOTED (the same hazard ci.yml's
        # vrt-strict-shard job cites when it bypasses the Taskfile to pass its
        # own alternation). A `|` here would become a PIPE inside that line —
        # most likely leaving Playwright with NO grep at all, i.e. a silent full
        # rewrite of every baseline. Refuse instead of mangling.
        case "$GREP" in
          '') : ;;
          *[!A-Za-z0-9_.-]*)
            echo "GREP='$GREP' is not a single shell-safe token ([A-Za-z0-9_.-]+)." >&2
            echo "An alternation cannot survive the unquoted CLI_ARGS join in the capture step — dispatch ALL=1 instead." >&2
            exit 1
            ;;
        esac
        FLAGS="-f ref=$BRANCH"
        if [ -n "$GREP" ]; then FLAGS="$FLAGS -f grep=$GREP"; fi
        if [ -n "$GREP" ]; then
          echo "Dispatching vrt-update.yml for branch '$BRANCH' grep=$GREP …"
        else
          echo "Dispatching vrt-update.yml for branch '$BRANCH' — FULL SWEEP, no grep …"
        fi
        # ⚠ `--ref "$BRANCH"` RUNS THE BRANCH'S OWN COPY of vrt-update.yml, and
        # that is load-bearing whenever a PR changes the capture itself.
        #
        # Without it `gh` reads the workflow from the DEFAULT branch and only
        # passes `ref` as an INPUT — so main's capture logic runs against the
        # branch's checkout. That silently mixes two versions, and it is not
        # hypothetical: during #1458 (the {platform} collapse) main still
        # declared a TWO-PLATFORM matrix while the branch had collapsed
        # `snapshotPathTemplate` to one set. A default-branch dispatch there
        # would have started a macos-latest job writing DARWIN pixels into the
        # now-platform-less baseline path and committing them as canonical —
        # the exact failure the PR exists to remove. Caught by noticing the run
        # reported `head_branch: main`; that field is the tell.
        #
        # The `revalidate` job still handles the required-status gate (a
        # workflow_dispatch run on ANY ref does not count toward it), so
        # nothing is lost by preferring the branch's copy.
        gh workflow run vrt-update.yml --ref "$BRANCH" $FLAGS
        echo "Dispatched. WATCH IT WITH:  flox activate -- task vrt:watch"
        echo "  (do NOT hand-roll a poll loop — the gh core quota is shared across every"
        echo "   agent, and three 45s loops drained it to 0/5000 on 2026-08-18. vrt:watch"
        echo "   backs off, waits out a rate limit, and reports what the run COMMITTED.)"

  vrt:watch:
    desc: |
      [watch a dispatched VRT capture] Poll the vrt-update run for THIS branch
      and report WHAT IT COMMITTED — the one watcher, so nobody hand-rolls
      another.

      ⚠ THE `gh` CORE QUOTA IS SHARED across every agent and the coordinator's
      board queries. Three hand-rolled 45s loops drained it to 0/5000 on
      2026-08-18; an exhausted quota answers 403, and a loop that cannot tell
      403 from "no failures" reports success on no data. This target backs off
      (30s while a ~3min scoped capture could still be running, then a 5min
      floor), asks the quota-exempt rate_limit endpoint before it spends, sleeps
      to the documented reset when exhausted, and ENDS at a hard cap.
      Cost: ~6 calls scoped, ~18 for a full sweep, against ~70 for a 45s loop.

      ⚠ IT REPORTS THE COMMITTED FILES, NOT THE CONCLUSION. `--update-snapshots`
      only rewrites a comparison that FAILED, so a baseline that is wrong but
      inside tolerance passes and commits NOTHING — a green dispatch that
      committed zero files is a RED FLAG, not a pass, and this says so in as
      many words. Pass your predicted count and it reconciles for you.

      Examples:
        task vrt:watch -- --run 32148747938
        task vrt:watch -- --run 32148747938 --predicted 6
        task vrt:watch -- --run 32148747938 --cap-min 90
    cmds:
      - node scripts/vrt-watch.mjs {{.CLI_ARGS}}

  vrt:docker:
    desc: |
      [OPTIONAL local fast path] Run the VRT suite inside the SAME container
      image CI renders in, so a local run is pixel-comparable to the gate.
      Requires Docker. Nothing in this repo requires this target — a native
      `task vrt` still works as a smoke test (does it render, does it throw),
      and `task vrt:commit` remains the only way to author a baseline.
      Why it exists: the baselines are authored by linux CI, so a native macOS
      run compares Metal-rendered text against Chromium-on-linux and reports
      font/AA drift that is not a regression. Under this image the comparison is
      the real one.
      ⚠ It runs against a dev server on the HOST (E2E_BASE_URL points back at
      host.docker.internal), so bring one up first: `task e2e:serve`.
      Examples:
        task e2e:serve && task vrt:docker
        task vrt:docker -- --grep adsr
    cmds:
      - |
        set -eu
        command -v docker >/dev/null 2>&1 || {
          echo "docker not found. This target is OPTIONAL — a native 'task vrt' is a valid" >&2
          echo "smoke test, and 'task vrt:commit' authors baselines on CI. Skipping." >&2
          exit 1
        }
        PORT="$(bash scripts/e2e-port.sh)"   # E2E_PORT wins; else per-worktree derived (#1597)
        # The image tag MUST track e2e/package.json's @playwright/test pin —
        # a different Playwright means a different bundled Chromium means
        # different pixels, which is the whole reason for using the image.
        IMAGE="mcr.microsoft.com/playwright:v$(node -p "require('./e2e/package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/,'')")-noble"
        echo "Running VRT in $IMAGE against http://host.docker.internal:$PORT …"
        docker run --rm -it \
          -v "$PWD":/work -w /work \
          -e E2E_BASE_URL="http://host.docker.internal:$PORT" \
          -e E2E_SKIP_WEBSERVER=1 \
          --add-host=host.docker.internal:host-gateway \
          "$IMAGE" \
          npx playwright test --config e2e/vrt/vrt.config.ts --workers=1 {{.CLI_ARGS}}

  vrt:one:
    desc: |
      [local dev-loop] Run ONE VRT scene by grep, 1 worker. Pass a card/module
      grep after `--`. Reuses a long-lived dev server if one is up
      (`task e2e:serve`) — vrt.config has reuseExistingServer:true — else boots
      one for this run. Uses dsp:ensure so Faust-less worktrees still work.
      REPEAT=N adds Playwright --repeat-each=N (the pre-MR flake-check for a
      new/changed VRT scene; REPEAT=3 is the standard).
      Examples:
        task vrt:one -- adsr
        task vrt:one -- --grep "scope"
        HEADED=1 task vrt:one -- adsr
        REPEAT=3 task vrt:one -- adsr    # flake-check: scene rendered 3×
    deps: [dsp:ensure, test:emit-manifest]
    cmds:
      - |
        # Same robust routing as e2e:one (see comments there): a bare word/phrase
        # becomes a convenience --grep; paths + raw flags pass through verbatim.
        eval "set -- {{.CLI_ARGS}}"
        case "${1:-}" in
          '')                 GREP_PREFIX="" ;;
          -*)                 GREP_PREFIX="" ;;
          */*|*.spec.ts|*.ts) GREP_PREFIX="" ;;
          *)                  GREP_PREFIX="--grep" ;;
        esac
        HEADED_FLAG=""; [ "${HEADED:-0}" = "1" ] && HEADED_FLAG="--headed"
        REPEAT_FLAG=""; [ "${REPEAT:-1}" -gt 1 ] && REPEAT_FLAG="--repeat-each=${REPEAT}"
        # `npm run vrt -w` runs from the e2e package dir (so spec paths + the
        # vrt/vrt.config.ts reference resolve) and already passes --config.
        # E2E_BASE_URL threading: vrt.config.ts reads it, so without this an
        # E2E_PORT-isolated run would silently capture from whatever dev server
        # holds the default port — see the note in e2e:one. Default = the
        # per-worktree derived port (scripts/e2e-port.sh, #1597); E2E_PORT wins;
        # the helper reads E2E_PREVIEW for the preview-mode range.
        PORT="$(bash scripts/e2e-port.sh)"
        if [ -n "$GREP_PREFIX" ]; then
          E2E_BASE_URL="http://localhost:$PORT" \
            npm run vrt -w {{.E2E}} -- --workers=1 $HEADED_FLAG $REPEAT_FLAG --grep "$*"
        else
          E2E_BASE_URL="http://localhost:$PORT" \
            npm run vrt -w {{.E2E}} -- --workers=1 $HEADED_FLAG $REPEAT_FLAG "$@"
        fi

  vrt:annotated:
    desc: |
      Generate the NUMBERED card-FACE doc assets for ALL sample modules: a
      numbered leader-line card screenshot → e2e/vrt/__annotated__/{type}.png
      (LFS) + number→test-id map → __annotated__/{type}.legend.json.
      The doc page (/docs/modules/[id]) renders the numbered face + a KEY that
      RESOLVES each number to its authored `docs.controls` blob. The face IS the
      asset, not a regression baseline. Then copies the faces into static/ via
      docs:faces. Override the set with ANNOTATED_MODULES="adsr,lfo".
    deps: [dsp:build, test:emit-manifest]
    cmds:
      - npm run vrt:annotated -w {{.E2E}} -- {{.CLI_ARGS}}
      - task: docs:faces

  vrt:annotated:one:
    desc: |
      [local dev-loop] Generate ONE module's numbered card face + key by name.
      Reuses a long-lived dev server if up (`task e2e:serve`). REPEAT=N
      flake-checks the generation. Example: task vrt:annotated:one -- adsr
    deps: [dsp:ensure, test:emit-manifest]
    cmds:
      - |
        eval "set -- {{.CLI_ARGS}}"
        REPEAT_FLAG=""; [ "${REPEAT:-1}" -gt 1 ] && REPEAT_FLAG="--repeat-each=${REPEAT}"
        # A bare module name → ANNOTATED_MODULES env (the spec's selector).
        case "${1:-}" in
          ''|-*) ANNOTATED_MODULES="" ;;
          *)     ANNOTATED_MODULES="$1"; shift ;;
        esac
        ANNOTATED_MODULES="$ANNOTATED_MODULES" \
          npm run vrt:annotated -w {{.E2E}} -- --workers=1 $REPEAT_FLAG "$@"

  docs:faces:
    desc: |
      Copy the numbered card faces from e2e/vrt/__annotated__/*.png into
      packages/web/static/docs/module-faces/{type}.png so the prerendered doc
      page can <img src> them.
      Idempotent; a no-op when no card faces exist yet.
    cmds:
      - bash scripts/copy-doc-faces.sh

  docs:accept:
    desc: |
      [accept-loop] Re-pin the module I/O CONTRACT golden (contract-lock.txt) to
      the live registry — the living-docs drift accept loop (the ART/VRT *:update
      analog). Run AFTER an INTENTIONAL contract change, having re-authored the
      affected module's co-located `docs`. ALWAYS review `git diff` of
      contract-lock.txt before committing (it is CODEOWNERS-gated): a diff means a
      module contract changed — accept it, or recognize it as a bug.
      contract-lock.txt is the ONLY committed artifact here: the render module
      (module-docs.generated.ts) is a gitignored BUILD ARTIFACT regenerated by
      the docs:ensure seam, never a git diff.
    cmds:
      - DOCS_UPDATE=1 npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts contract-lock
      - 'echo "[docs:accept] re-pinned contract-lock.txt — review the git diff before committing"'

  docs:check:
    desc: Run the living-docs drift gate (contract-lock) read-only — the same check CI runs.
    cmds:
      - npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts contract-lock

  docs:ensure:
    desc: |
      Generate src/lib/docs/module-docs.generated.ts — the render module the
      prerendered /docs/modules/[id] page (and Canvas's has-docs check) imports.
      A gitignored BUILD ARTIFACT since the LoC row-4 PR (never committed, never
      hand-edited): the module-docs-ensure spec re-emits it from the live
      registry on every full unit sweep, and this target runs that same spec as
      the explicit seam for the non-vitest lanes — a dep of build / build:web /
      dev / dev:full / typecheck (svelte-check and `vite build` both hard-fail
      on the missing import otherwise). The spec doubles as the gate: emit
      round-trip + generator determinism + the gitignore ratchet
      (contract-lock.txt stays the only PINNED living-docs artifact).
    cmds:
      - npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts module-docs-ensure

  face:propose:
    desc: |
      Auto-propose a DRAFT workflow `face` (the UI-curation ranking) for a module,
      from its card render-order + def params — for HUMAN review. Prints a
      `face: { … }` snippet to paste + edit into the def; NEVER mutates a def and
      NEVER auto-accepts. `--out <dir>` writes drafts to files instead.
        flox activate -- task face:propose -- kickdrum
        flox activate -- task face:propose -- --all --out .myrobots/face-drafts
    cmds:
      - node --import tsx scripts/propose-face.ts {{.CLI_ARGS}}

  face:check:
    desc: Run the module-face curation drift gate (module-face-lint) read-only — the same check CI runs.
    cmds:
      - npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts module-face-lint

  face:accept:
    desc: |
      [accept-loop] The face-curation accept step (the docs:accept analog for UI
      curation). `face` is UI metadata, NOT the I/O contract — it has NO committed
      golden (it is kept OUT of contract-lock.txt); its pin is STRICT_FACES
      membership + the module-face-lint gate. Run AFTER authoring/editing a `face`
      + promoting the module into STRICT_FACES + raising the ratchet floor: this
      re-runs the gate to confirm the curation is COMPLETE + consistent, then
      reminds you to review the def's git diff before committing.
    cmds:
      - npm exec -w {{.WEB}} -- vitest run --config vitest.config.ts module-face-lint
      - 'echo "[face:accept] module-face-lint green — review the def git diff (face + STRICT_FACES + ratchet floor) before committing"'

  vrt:gallery:
    desc: Build the VRT gallery HTML (docs/vrt/) from the latest baselines + last test-results
    cmds:
      - python3 e2e/vrt/build_gallery.py
          --baseline-dir e2e/vrt/__screenshots__
          --results-dir  e2e/vrt/test-results
          --output-dir   docs/vrt

  vrt:changeset:
    desc: |
      Build the per-PR VRT CHANGESET gallery (docs/vrt-changeset/) — only the
      baseline PNGs THIS branch changed vs its base, each as OLD/NEW/DIFF.
      git-diff-driven (works whether or not the new baselines are committed) +
      LFS-aware. Used by the vrt-changeset-gallery.yml workflow to publish a
      CF Pages link + PR comment. Pass extra flags after `--`.
      Examples:
        task vrt:changeset                          # base = merge-base(origin/main, HEAD)
        task vrt:changeset -- --base origin/main --pr 759
    cmds:
      - node scripts/vrt-changeset-gallery.mjs {{.CLI_ARGS}}

  # ---------------- WebGL local-GPU attestation ("semaphore") ----------------
  # CI's only WebGL renderer is SwiftShader and the heavy WebGL e2e lane is
  # disabled on PRs (24-27 min + timeout-prone on software GL). This scheme runs
  # the full WebGL set on THIS machine's REAL GPU and writes a content-hash-named
  # attestation that CI verifies (then skips the heavy lane, trusting the local
  # run). See ci-webgl-attest/README.md +
  # .claude/skills/webgl-attest.md.
  webgl:attest:
    desc: |
      [pre-PR, REAL-GPU] Run the FULL WebGL test set on this machine's real GPU
      (NOT SwiftShader) in three passes (heavy / leakers / camera) and, only on
      a fully-green run with matching measured spec counts, write
      ci-webgl-attest/<hash>.json so CI can skip the heavy WebGL lane. Run this
      before opening a PR that touches any WebGL/video path, then commit the
      written file. REPEAT=3 flake-checks. `-- --dry-run` verifies the
      pass-selection/count-gating/writer wiring without the long real-GPU run.
    deps: [dsp:ensure, test:emit-manifest]
    cmds:
      - bash scripts/webgl-attest.sh {{.CLI_ARGS}}

  webgl:attest:check:
    desc: |
      [read-only] Recompute the WebGL content-hash and report whether a matching
      attestation already exists (so you know if a re-attest is needed after a
      pull/rebase). Runs nothing. `-- --list` prints the full hash basis.
    cmds:
      - |
        if [ "{{.CLI_ARGS}}" = "--list" ]; then
          bash scripts/webgl-attest-hash.sh --list
          exit 0
        fi
        HASH="$(bash scripts/webgl-attest-hash.sh)"
        echo "WebGL content hash: $HASH"
        if [ -f "ci-webgl-attest/$HASH.json" ]; then
          echo "✓ A matching attestation exists (ci-webgl-attest/$HASH.json). No re-attest needed."
        else
          echo "✗ No matching attestation. Run: flox activate -- task webgl:attest"
          exit 1
        fi

  webgl:attest:verify:
    desc: '[CI] Recompute the WebGL content-hash + verify a matching real-GPU attestation exists (the webgl-attest CI job runs this).'
    cmds:
      - bash scripts/webgl-attest-verify.sh

  # ---------------- E2E (Playwright) ----------------
  e2e:
    desc: 'Run end-to-end tests (headless Chromium). Pass extra Playwright args after `--` (e.g. `task e2e -- tests/foo.spec.ts`).'
    # io-spec-consistency, modules, and the upcoming per-module spec
    # iterate the registry manifest at file-parse time
    # (e2e/tests/_registry.ts). Refresh it before Playwright discovers
    # specs so a freshly-registered module is auto-enrolled without
    # the contributor having to remember a side-effect command.
    deps: [test:emit-manifest]
    cmds:
      - npm test -w {{.E2E}} -- {{.CLI_ARGS}}

  e2e:serve:
    desc: |
      [local dev-loop] Boot ONE long-lived app server and leave it up, so many
      `task e2e:one` / `task vrt:one` runs reuse it instead of paying the
      ~5-10s server boot every time. Readies the DSP dist (dsp:ensure, Faust-less
      OK) + registry manifest first, then starts the server in the background.
      The port defaults to a PER-WORKTREE derived value (scripts/e2e-port.sh —
      dev 5600-5999, preview 4400-4799; #1597) so sibling checkouts never
      collide on one shared port; E2E_PORT overrides. E2E_PREVIEW=1 serves the
      prod `vite preview` build instead of the dev server. Tear down with
      `task e2e:stop`.
    deps: [dsp:ensure, test:emit-manifest]
    cmds:
      # Build the prod bundle first when serving preview (preview needs a build).
      # VITE_E2E_HOOKS=1 is REQUIRED at BUILD time and was missing here: the
      # helpers drive the app through `window.__ensureEngine` / `__patch`, and
      # those hooks are TREE-SHAKEN OUT of a prod bundle without it. ci.yml's
      # build-web already sets it (that is why CI's preview lane works); locally
      # the flagless build produced a bundle where EVERY `task e2e:one` died in
      # `spawnPatch` waiting for `__ensureEngine`, which reads as a broken test
      # rather than a broken server. Same flag, same reason, both places.
      - |
        if [ "${E2E_PREVIEW:-0}" = "1" ]; then
          echo "[e2e:serve] E2E_PREVIEW=1 → building web for preview (VITE_E2E_HOOKS=1)"
          VITE_E2E_HOOKS=1 npm run build -w {{.WEB}}
        fi
      - bash scripts/dev-server.sh start

  e2e:stop:
    desc: '[local dev-loop] Stop the long-lived server started by e2e:serve (frees the port). E2E_PREVIEW=1 to stop the preview server.'
    cmds:
      - bash scripts/dev-server.sh stop

  e2e:status:
    desc: '[local dev-loop] Report whether the long-lived e2e server is up. E2E_PREVIEW=1 to check the preview server.'
    cmds:
      - bash scripts/dev-server.sh status

  e2e:one:
    desc: |
      [local dev-loop] Run ONE e2e spec/test against the ALREADY-RUNNING server
      (1 worker, line reporter). Fails fast with a hint if no server is up — run
      `task e2e:serve` once first. Pass a spec path and/or `--grep <name>` after
      `--`; a bare word becomes a --grep. HEADED=1 to watch. E2E_PREVIEW=1 to
      target the preview server. REPEAT=N adds Playwright --repeat-each=N — the
      pre-MR flake-check you owe any new/changed e2e test (REPEAT=3 standard).
      Examples:
        task e2e:serve                         # once
        task e2e:one -- tests/ai-smoke.spec.ts
        task e2e:one -- adsr                   # grep
        HEADED=1 task e2e:one -- tests/audio-gate.spec.ts
        REPEAT=3 task e2e:one -- adsr          # flake-check: 3 clean runs required
    deps: [test:emit-manifest]
    cmds:
      # Fail fast (clear message) if the persistent server isn't up — we set
      # E2E_SKIP_WEBSERVER so Playwright won't silently boot its own (which
      # would defeat the reuse-and-go-fast point).
      - bash scripts/dev-server.sh assert-up
      - |
        # go-task preserves the caller's quoting in CLI_ARGS (a multi-word
        # `--grep "a b c"` arrives as `--grep 'a b c'`). `eval set --` re-parses
        # it into "$@" so a quoted grep survives word-splitting.
        eval "set -- {{.CLI_ARGS}}"
        # Arg routing for ergonomics, based on the FIRST token:
        #   - starts with `-`        → raw playwright flags, pass through as-is
        #   - looks like a path/spec → positional file filter (has `/` or .ts)
        #   - otherwise a bare word  → convenience --grep on test titles, and we
        #     keep ALL remaining tokens together so `task e2e:one -- foo bar`
        #     greps the title "foo bar".
        case "${1:-}" in
          '')                 GREP_PREFIX="" ;;
          -*)                 GREP_PREFIX="" ;;
          */*|*.spec.ts|*.ts) GREP_PREFIX="" ;;
          *)                  GREP_PREFIX="--grep" ;;
        esac
        HEADED_FLAG=""; [ "${HEADED:-0}" = "1" ] && HEADED_FLAG="--headed"
        REPEAT_FLAG=""; [ "${REPEAT:-1}" -gt 1 ] && REPEAT_FLAG="--repeat-each=${REPEAT}"
        # HONOUR E2E_PORT — scripts/dev-server.sh already does, and this line
        # used to NOT, which made `E2E_PORT=N task e2e:one` actively dangerous
        # rather than merely useless: `assert-up` (above) checked the ISOLATED
        # server on N and passed, then Playwright was pointed at the hardcoded
        # shared default — i.e. whatever OTHER dev server the developer had
        # open. Parallel agents were silently driving the human's session. The
        # two must derive the port from the same place or the isolation is
        # theatre — which is why BOTH now resolve through scripts/e2e-port.sh
        # (E2E_PORT wins; else the per-worktree derived port, #1597; the helper
        # reads E2E_PREVIEW for the preview-mode range).
        PORT="$(bash scripts/e2e-port.sh)"
        # `npm test -w` runs `playwright test` FROM the e2e package dir so spec
        # paths (tests/foo.spec.ts) resolve against testDir. E2E_SKIP_WEBSERVER
        # tells playwright.config NOT to boot its own server — we reuse the
        # long-lived one (asserted up above), which is the whole speed-up.
        if [ -n "$GREP_PREFIX" ]; then
          E2E_SKIP_WEBSERVER=1 E2E_USE_PREVIEW="${E2E_PREVIEW:-}" \
          E2E_BASE_URL="http://localhost:$PORT" \
            npm test -w {{.E2E}} -- --workers=1 --reporter=list $HEADED_FLAG $REPEAT_FLAG --grep "$*"
        else
          E2E_SKIP_WEBSERVER=1 E2E_USE_PREVIEW="${E2E_PREVIEW:-}" \
          E2E_BASE_URL="http://localhost:$PORT" \
            npm test -w {{.E2E}} -- --workers=1 --reporter=list $HEADED_FLAG $REPEAT_FLAG "$@"
        fi

  e2e:no-collab:
    desc: 'E2E EXCLUDING the @collab multi-context specs (they run in their own non-sharded CI job — the in-memory Hocuspocus relay flakes under shard contention). Used by the sharded CI matrix.'
    deps: [test:emit-manifest]
    cmds:
      - npm exec -w {{.E2E}} -- playwright test --grep-invert '@collab|@capacity' {{.CLI_ARGS}}

  behavioral:negative-control:
    desc: |
      [#1337] Run the behavioral sweep with EVERY PERTURBATION EDGE OMITTED, and
      assert no row passes. This is the gate that makes the sweep's PASS verdict
      mean something: with nothing wired to the port under test, a row reporting
      "this port perturbs the observed output" is a FALSE POSITIVE — it certifies
      coverage that does not exist, and unlike a red row nobody investigates it.

      GREEN here ⟺ no row can pass without a perturbation edge.

      Not part of `task ci`: it costs a second full pass of the (already ~30-50
      min) behavioral sweep, so it belongs on demand and on a schedule rather
      than on every PR. Run it after touching computeDelta, the universal floors,
      BEHAVIORAL_DELTA_THRESHOLDS, a driver, or a capture window — all four can
      move a row's null scatter without moving anything the ordinary sweep prints.

      ⚠ Read the RATE, not just the exit code: each module logs
      `[behavioral][negative-control] <mod>: rows=N falsePasses=N …`.

      Needs a server: `task e2e:serve` first (or drop E2E_SKIP_WEBSERVER).
      Examples:
        task behavioral:negative-control
        task behavioral:negative-control -- --grep 'snaredrum:'
    deps: [test:emit-manifest]
    cmds:
      - bash scripts/dev-server.sh assert-up
      - |
        PORT="$(bash scripts/e2e-port.sh)"
        BEHAVIORAL_NEGATIVE_CONTROL=1 E2E_SKIP_WEBSERVER=1 \
        E2E_BASE_URL="http://localhost:$PORT" \
          npm test -w {{.E2E}} -- per-module-per-port-behavioral --workers=1 \
            --retries=0 --reporter=line {{.CLI_ARGS}}

  collab:
    desc: 'Run ONLY the @collab multi-context specs on a DEDICATED runner (off the 8-shard matrix). Modest 2-worker parallelism — far below the 8-shard × 4-worker fan-out that hammered the shared relay (the #97 flake) — keeps the DOOM 2-user gate reliable while finishing within the CI time budget (a single serial worker overran 25 min on 41 specs). The Hocuspocus relay is in-memory so this is cheap.'
    deps: [test:emit-manifest]
    cmds:
      - npm exec -w {{.E2E}} -- playwright test --grep '@collab|@capacity' --workers=2 {{.CLI_ARGS}}

  audio-drift:
    desc: |
      Phase-C decision research harness. Drives two browser contexts on the same
      Yjs rackspace, builds N patches, captures audio from each side, and writes
      drift metrics + a recommendation to art/audio-drift/. Tagged @audio-drift
      so it stays out of CI's PR-gate path. Vars:
        AUDIO_DRIFT_SECONDS=<n>     Recording duration per scenario (default 5).
        E2E_BASE_URL=<url>          Run against a remote target (default local).
        DATABASE_URL=<conn>         Postgres URL for the local Hocuspocus server
                                    (defaults to the Flox-provided dev DB).
    env:
      DATABASE_URL: '{{.DATABASE_URL | default "postgresql://postgres:dev@localhost:54320/patchtogether_dev"}}'
    cmds:
      - npm exec -w {{.E2E}} -- playwright test --config=audio-drift/audio-drift.config.ts

  chaos:run:
    desc: |
      Chaos Stage-1 run. Spawns Chromium, drives Chaos Carl through 200 random
      intents (configurable via CHAOS_ITERATIONS), checks invariants between
      each. On a violation: dumps artifacts to e2e/chaos/findings/<dir>/ and
      fails. Vars:
        CHAOS_SEED=<int>            deterministic seed
        CHAOS_ITERATIONS=<int>      intents per run (default 200)
        CHAOS_MAX_NODES=<int>       per-bot module cap (default 6) — keep low
                                    in shared rackspaces so bots don't flood
                                    the canvas
        CHAOS_RACKSPACE_URL=<url>   join a deployed rackspace via invite link
                                    instead of running solo against '/'. Skips
                                    clearPatch so the bot just shows up and
                                    plays.
        BETA_GATE_PASS=<pw>         beta-gate basic-auth password for
                                    deployed tiers (user is `beta` by
                                    default; matches the server env var).
                                    Example:
                                    BETA_GATE_PASS=$BETA_GATE_PASS \
                                      CHAOS_RACKSPACE_URL='https://autotest.patchtogether.live/r/abc?invite=xyz' \
                                      E2E_BASE_URL=https://autotest.patchtogether.live task chaos:run
    cmds:
      - npm exec -w {{.E2E}} -- playwright test --config=chaos/chaos.config.ts

  ci:smoke:live:
    desc: Live-deploy smoke (set E2E_BASE_URL; defaults to autotest.patchtogether.live). Runs only the @smoke-tagged subset; never blocks the PR gate.
    cmds:
      - 'echo "→ Live smoke against: ${E2E_BASE_URL:-https://autotest.patchtogether.live}"'
      # Use `npm exec -w` rather than a bare `playwright` so the binary
      # resolves via the e2e workspace's node_modules/.bin without depending
      # on shell PATH inheritance — go-task spawns a subshell that doesn't
      # auto-pick up node_modules/.bin (caused exit 127 in CI).
      - E2E_BASE_URL="${E2E_BASE_URL:-https://autotest.patchtogether.live}" npm exec -w {{.E2E}} -- playwright test --grep @smoke

  ci:smoke:prod-build:
    desc: Build the prod bundle, boot `vite preview`, run @smoke specs against it. Catches minification + static-asset regressions before they ship.
    deps: [build]
    env:
      E2E_USE_PREVIEW: '1'
    cmds:
      - npm test -w {{.E2E}} -- --grep @smoke

  e2e:headed:
    desc: Run E2E tests with browser window visible
    cmds:
      - npm test -w {{.E2E}} -- --headed

  e2e:debug:
    desc: Run E2E tests in Playwright Inspector
    cmds:
      - npm test -w {{.E2E}} -- --debug

  e2e:ui:
    desc: Open Playwright UI mode (interactive test runner)
    cmds:
      - npm exec -w {{.E2E}} -- playwright test --ui

  # ---------------- AI agent helpers ----------------
  # These commands emit concise, parseable output suitable for an AI agent
  # to validate "does the app work?" without a human in the loop.
  ai:check:
    desc: AI-friendly smoke check — concise pass/fail across all the things that matter
    cmds:
      - npm run ai:check -w {{.E2E}}

  ai:debug:
    desc: AI-friendly diagnostic — boots the page, captures DOM snapshot + console + screenshot
    cmds:
      - npm run ai:debug -w {{.E2E}}

  # ---------------- CI shape ----------------
  ci:
    desc: Run the full PR-gate suite (typecheck + unit + ART + E2E + VRT-strict)
    # VRT-strict (deterministic knob/fader subset) gates `task ci` so a
    # baseline drift on a pure-CSS card fails locally just as fast as
    # the unit suite. The full `task vrt` sweep (canvas-driven cards
    # that legitimately flake — masked previews, animated chrome) stays
    # informational and runs only in the dedicated CI VRT job.
    cmds:
      - task: typecheck
      - task: test
      - task: art
      - task: e2e
      - task: vrt:strict

  # ---------------- Secret-sync ops ----------------
  sync-secrets:
    desc: |
      Push per-tier secrets to BOTH the Fly relay AND the CF Pages web project
      so INVITE_SECRET (+ Clerk + DATABASE_URL) can never drift out of lockstep
      — drift silently rejects every anonymous invite guest at the WS handshake.
      Reads ~/.config/patchtogether/cf.env. DEFAULTS TO DRY-RUN (names only,
      never echoes values). Pass `--apply` to actually push; prod additionally
      requires `--yes-prod`. Examples:
        task sync-secrets -- dev                 # dry-run
        task sync-secrets -- dev --apply         # push dev to Fly + CF
        task sync-secrets -- prod --apply --yes-prod
    cmds:
      - bash scripts/sync-secrets.sh {{.CLI_ARGS}}

  smoke:anon-handshake:
    desc: |
      Deploy-time guard: mint a REAL anon invite + open a REAL WS handshake to
      the deployed relay (wss://patchtogether-server-<tier>.fly.dev) and assert
      onAuthenticate ACCEPTS — catches INVITE_SECRET drift between the deployed
      web app and relay (the silent "every anon guest rejected" bug). Needs the
      canonical INVITE_SECRET in env (same value sync-secrets pushes to both
      targets); SKIPS cleanly if unset. Tier via TIER env (default autotest).
      Example:
        INVITE_SECRET=$SECRET TIER=dev task smoke:anon-handshake
    cmds:
      - node scripts/anon-handshake-smoke.mjs "${TIER:-autotest}"

  # ---------------- Housekeeping ----------------
  worktree:list:
    desc: Show every git worktree + classification against the cap. Changes nothing.
    cmds:
      - bash scripts/worktree-guard.sh report

  worktree:clean:
    desc: Prune gone worktrees + remove ABANDONED ones (dead agent lock, clean, fully pushed).
    cmds:
      - bash scripts/worktree-guard.sh clean

  worktree:guard:
    desc: |
      Enforce the repo worktree cap (default 10). Auto-removes abandoned worktrees,
      then exits non-zero listing any that still need a human. RUN THIS BEFORE
      creating a new worktree. Override the cap with WORKTREE_CAP=N.
    cmds:
      - bash scripts/worktree-guard.sh enforce

  pr:conflict-sweep:
    desc: |
      After a merge to main, list the open PRs the merge just turned CONFLICTING
      so they get rebased before they rot. Report-only. `-- --mine` for yours.
      See CLAUDE.md "Post-merge conflict sweep".
    cmds:
      - bash scripts/pr-conflict-sweep.sh {{.CLI_ARGS}}

  ci:health:
    desc: Show every open PR + its CI check status + failing test lines.
    cmds:
      - bash scripts/ci-health.sh

  pr:watch:
    desc: |
      Block until a PR's checks resolve, then print failing detail
      (usage: task pr:watch -- <pr#>).
    cmds:
      - bash scripts/ci-health.sh --watch {{.CLI_ARGS}}

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf {{.DSP}}/dist
      - rm -rf {{.WEB}}/.svelte-kit {{.WEB}}/build
      - rm -rf {{.E2E}}/playwright-report {{.E2E}}/test-results
      - rm -rf node_modules/.cache .vite

  clean:deep:
    desc: Nuke node_modules + lockfile (use sparingly)
    prompt: This will delete node_modules and package-lock.json. Continue?
    cmds:
      - rm -rf node_modules packages/*/node_modules art/node_modules e2e/node_modules
      - rm -f package-lock.json
