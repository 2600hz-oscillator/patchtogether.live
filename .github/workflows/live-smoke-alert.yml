name: Live Smoke Alert

# Every 10 minutes: probe dev.patchtogether.live + the Hocuspocus relay, and
# RECONCILE the open alert issues against the result. This is the backstop layer
# alongside BetterStack (set up separately per docs/observability/setup-betterstack.md);
# it works whether or not BetterStack is configured.
#
# Why this exists: per memory `project_observability_priority.md` the previous
# relay OOM went UNALERTED — there was no probe of the Fly machine's resources
# and no escalation when /health stopped responding. The matching /metrics
# endpoint (packages/server/src/http-introspection.ts) is the source of the
# rss_mb reading this workflow gates on.
#
# ── ONE ISSUE PER ALERT, NOT ONE PER RUN ───────────────────────────────────
#
# This workflow used to call `issues.create()` on every firing run, so a single
# ongoing incident opened a brand-new issue every cron tick — 45 of 47 open
# issues on 2026-07-29 were the same Neon HTTP 402, and none of them ever
# auto-closed. Issue creation now goes through `scripts/alert-issues.mjs`, which
# keeps exactly ONE open issue per `live-smoke/<env>/<check-id>` key:
#
#     failing, no open issue for the key → CREATE (notifies watchers)
#     failing, issue already open        → PATCH its stats block (no notify)
#     open issue, check no longer failing→ COMMENT "recovered" + CLOSE
#
# It is dedup, not suppression: a DIFFERENT check failing is a different key and
# always opens its own issue with a fresh notification, even mid-incident, and
# there is deliberately no rate limit or cooldown anywhere in the path. The
# decision is a pure function with unit tests + negative controls in
# `scripts/alert-issues.test.ts` (the `unit` lane) — including the two that
# matter most: an issue with no key marker is NEVER touched (human-filed issues
# are safe), and a probe that produced no usable result closes NOTHING.
#
# Required repo VARS (Settings → Secrets and variables → Actions → Variables):
#   LIVE_SMOKE_WEB_URL    — e.g. https://dev.patchtogether.live (default if unset)
#   LIVE_SMOKE_RELAY_URL  — e.g. https://patchtogether-server-dev.fly.dev
#   LIVE_SMOKE_CRIT_MB    — RSS threshold above which we treat as CRIT (default 480)
#
# Required repo SECRETS:
#   DEV_BETA_GATE_PASS    — basic-auth pass for dev.patchtogether.live's gate
#                           (per memory `reference_beta_gate_creds.md`: user `beta`)
#
# NOTE: the alert state now lives in the ISSUES THEMSELVES (first-seen /
# last-seen / consecutive-failure count in the body's stats block), not in a
# `live-smoke-state` artifact. Artifacts expire and silently reset the state
# machine; an open issue does not.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the reconcile plan without writing any issue'
        required: false
        default: 'false'

concurrency:
  # Never cancel-in-progress AND never run two reconciles at once: two
  # concurrent runs could each see "no open issue for this key" and both open
  # one. (The reconciler self-heals that case by closing the newer as a
  # duplicate, but not racing in the first place is cheaper.)
  group: live-smoke-alert
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Probe + alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_URL: ${{ vars.LIVE_SMOKE_WEB_URL || 'https://dev.patchtogether.live' }}
      RELAY_URL: ${{ vars.LIVE_SMOKE_RELAY_URL || 'https://patchtogether-server-dev.fly.dev' }}
      RELAY_MEM_CRIT_MB: ${{ vars.LIVE_SMOKE_CRIT_MB || '480' }}
      BETA_GATE_PASS: ${{ secrets.DEV_BETA_GATE_PASS }}
      BETA_GATE_USER: beta
    steps:
      - uses: actions/checkout@v4

      # The probe runs EXACTLY ONCE. (It used to run twice — once to set the
      # step's exit code, once to capture stdout — which burned two round trips
      # per tick and, worse, let the two probes disagree about health.)
      - name: Run smoke probe
        id: probe
        run: |
          set -o pipefail
          bash scripts/live-smoke-alert.sh 2>&1 | tee /tmp/smoke.out || true
          echo "--- captured $(wc -l < /tmp/smoke.out) line(s) of probe output ---"

      # Reconcile open alert issues against the probe result. Parses the log,
      # plans, and applies — all in scripts/alert-issues.mjs so the logic is
      # unit-tested rather than being untestable inline YAML.
      - name: Reconcile alert issues
        id: alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_LOG: /tmp/smoke.out
          ALERT_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/alert-issues.mjs reconcile

      - name: Fail the job if unhealthy
        if: steps.alerts.outputs.healthy != 'true'
        # Via env, never `${{ }}` inside the script body — the docs-only-gate
        # discipline: interpolated values are spliced in before the shell runs.
        env:
          FAILING: ${{ steps.alerts.outputs.failing }}
        run: |
          echo "::error::live smoke probe failed: ${FAILING:-probe produced no result}"
          exit 1
