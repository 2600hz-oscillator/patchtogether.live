# VRT: update baselines (on demand)
#
# THE ONLY BASELINE AUTHOR. There is ONE baseline set — `snapshotPathTemplate`
# has no `{platform}` segment (see e2e/vrt/vrt.config.ts) — and this workflow,
# on ubuntu-latest, is what writes it. A developer never commits a baseline:
# they push, CI compares, and an intentional render change is captured HERE and
# reviewed as a PR diff through the changeset gallery ci.yml posts.
#
# ⚠ THIS USED TO BE A TWO-PLATFORM MATRIX (ubuntu + macos-latest), because
# baselines were committed per-platform. That was the defect, not the design:
# CI gates on linux, so the darwin half was a second population nothing on the
# merge path ever read. Measured the day it was removed — 300 darwin PNGs, 156
# linux, 146 darwin scenes with NO linux sibling. The macos job, the
# `platform` input, and the skip-propagation hazard its `if:` created in
# `revalidate` all went with it.
#
# After the capture it re-validates the PR by re-firing a `pull_request` CI run
# (a GITHUB_TOKEN push does NOT auto-trigger CI, and a workflow_dispatch run
# does NOT count toward a PR's required-status-check gate — see the
# `revalidate` job below for the full story). We close+reopen the PR so the
# `reopened` pull_request event re-runs the required checks against the fresh
# baselines.
#
# Usage:  gh workflow run vrt-update.yml -f ref=<branch>
name: VRT update baselines

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate VRT baselines for
        required: true
        type: string
      grep:
        description: Optional Playwright --grep to scope capture to specific cards (leaves other baselines untouched)
        required: false
        default: ''
        type: string

permissions:
  contents: write        # commit + push regenerated baselines back to the branch
  pull-requests: write   # close+reopen the PR to re-fire pull_request CI (revalidate job)

concurrency:
  group: vrt-update-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The capture. Mirrors the ci.yml `vrt` job (postgres service container), but
  # runs vrt:update and commits the regenerated e2e/vrt/__screenshots__/ PNGs.
  # ---------------------------------------------------------------------------
  capture:
    name: regenerate VRT baselines
    runs-on: ubuntu-latest
    # 40 -> 75 (2026-08-10). MEASURED, not padded: with the platform dimension
    # collapsed every scene runs on linux, so the sweep went from ~151 executed
    # tests to 297. The first capture at 40 min was KILLED at test 241 of 297
    # having written ~146 baselines it never got to commit (run 31450544563;
    # GitHub reports a timeout-minutes kill as `cancelled`, not `failure`, which
    # is why it did not look like a timeout). Rate: 241 tests in 36.8 min of
    # Playwright = 9.2 s/test, so 297 tests ~= 45.5 min + ~3.5 min of
    # checkout/npm/DSP setup ~= 49 min. 75 leaves ~50 % headroom for a slow
    # runner. On-demand workflow: this costs zero per-PR wall time.
    timeout-minutes: 75
    outputs:
      # 'true' only when a baseline commit was actually pushed. A capture that
      # rewrote nothing still SUCCEEDS, so `revalidate` needs this to tell
      # "captured" from "ran and changed nothing" — see the revalidate `if:`.
      pushed: ${{ steps.commit.outputs.pushed }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patchtogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchtogether_test
    steps:
      - name: Checkout ${{ inputs.ref }} (LFS for VRT baseline PNGs)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: true

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Cache npm + Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install workspace deps + Playwright Chromium
        run: flox activate -- task setup

      - name: Apply DB schema
        run: flox activate -- scripts/apply-db-schema.sh "$DATABASE_URL"

      - name: Cache DOOM WASM artifact
        id: cache-doom-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/web/static/doom/doom.js
            packages/web/static/doom/doom.wasm
          key: ${{ runner.os }}-doom-wasm-${{ hashFiles('packages/web/native/build-doom-wasm.sh', 'packages/web/native/doomgeneric/**') }}

      - name: Build DOOM WASM (emcc)
        if: steps.cache-doom-wasm.outputs.cache-hit != 'true'
        run: flox activate -- bash packages/web/native/build-doom-wasm.sh

      - name: Regenerate VRT baselines
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            flox activate -- task vrt:update -- --grep "$GREP"
          else
            flox activate -- task vrt:update
          fi

      - name: Commit + push baselines
        id: commit
        run: flox activate -- bash .github/scripts/vrt-commit-baselines.sh "${{ inputs.ref }}"

  # ---------------------------------------------------------------------------
  # Re-validate: the baseline commit was pushed by GITHUB_TOKEN, which does NOT
  # fire `push`/`pull_request` — so the PR's required VRT check never re-runs
  # against the fresh baselines on its own.
  #
  # We CANNOT fix this with `gh workflow run ci.yml --ref <branch>`
  # (workflow_dispatch). CONFIRMED on PR #524: GitHub does NOT credit
  # workflow_dispatch-produced check-runs to a PR's required-status-check merge
  # gate. The ruleset keeps reporting "required status checks are expected" even
  # though the dispatched run is green, and even `gh pr merge --admin` is
  # refused. Required checks are only counted from a `pull_request` (or push)
  # event for the PR's head SHA.
  #
  # FIX: re-trigger a `pull_request` run by close+reopen of the PR for this
  # branch. The `reopened` action fires a `pull_request` event → ci.yml runs
  # under that event → its check-runs DO count toward the required-status gate.
  # GH_TOKEN (the workflow GITHUB_TOKEN) can close/reopen a PR; this does NOT
  # touch the commits, only re-fires the event. No-open-PR is handled gracefully
  # (the baselines are already pushed; whoever opens the PR later gets a normal
  # pull_request run).
  #
  # ── THE `if:` IS STILL LOAD-BEARING, FOR ONE REASON NOW ────────────────
  # A capture that rewrote NOTHING still SUCCEEDS — Playwright only rewrites a
  # snapshot whose comparison FAILS — so `needs: capture` alone would
  # close+reopen the PR and burn ~25 min of CI on a branch whose baselines did
  # not move. `capture.outputs.pushed` is what tells "captured" from "ran and
  # changed nothing".
  #
  # ⚠ AND THE HAZARD THAT USED TO LIVE HERE IS GONE WITH THE MATRIX, not fixed.
  # `needs: [linux, darwin]` with no `if:` defaults to `success()`, and GitHub
  # PROPAGATES a skipped dependency — so with two platform jobs each carrying
  # their own `if:`, a single-platform dispatch (the one CLAUDE.md recommended,
  # to save the redundant runner) skipped the other job and therefore skipped
  # revalidate, silently, on a green run. The documented close+reopen was
  # notional for every single-platform capture between 2026-06 and 2026-08-03.
  # With ONE capture job there is no sibling to skip and no propagation to
  # reason about: the defect was deleted along with the dimension that created
  # it, which is strictly better than the `always() && …` patch that was
  # standing in for it.
  #
  # Guarded by scripts/vrt-update-revalidate.test.ts, which simulates GitHub's
  # skip propagation over the real YAML.
  # ---------------------------------------------------------------------------
  revalidate:
    name: re-validate CI on ${{ inputs.ref }} (close+reopen PR)
    runs-on: ubuntu-latest
    needs: capture
    if: ${{ needs.capture.outputs.pushed == 'true' }}
    permissions:
      pull-requests: write   # close + reopen the PR to re-fire pull_request
    steps:
      - name: Close + reopen the PR to re-fire pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Find the open PR whose head branch is this ref.
          PR="$(gh pr list --repo "$REPO" --head "$REF" --state open \
                  --json number -q '.[0].number')"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR with head '$REF' — nothing to re-validate."
            echo "Fresh baselines are already pushed; opening a PR for this"
            echo "branch will trigger a normal pull_request CI run."
            exit 0
          fi
          echo "Re-firing pull_request for PR #$PR (close → reopen)…"
          gh pr close  "$PR" --repo "$REPO"
          gh pr reopen "$PR" --repo "$REPO"
          echo "Reopened PR #$PR — its pull_request CI run now validates the"
          echo "fresh baselines and counts toward the required-status gate."
