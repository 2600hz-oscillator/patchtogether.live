# VRT: update baselines (on demand)
#
# THE ONLY BASELINE AUTHOR. There is ONE baseline set — `snapshotPathTemplate`
# has no `{platform}` segment (see e2e/vrt/vrt.config.ts) — and this workflow,
# on ubuntu-latest, is what writes it. A developer never commits a baseline:
# they push, CI compares, and an intentional render change is captured HERE and
# reviewed as a PR diff through the changeset gallery ci.yml posts.
#
# ⚠ THIS USED TO BE A TWO-PLATFORM MATRIX (ubuntu + macos-latest), because
# baselines were committed per-platform. That was the defect, not the design:
# CI gates on linux, so the darwin half was a second population nothing on the
# merge path ever read. Measured the day it was removed — 300 darwin PNGs, 156
# linux, 146 darwin scenes with NO linux sibling. The macos job, the
# `platform` input, and the skip-propagation hazard its `if:` created in
# `revalidate` all went with it.
#
# After the capture it re-validates the PR by re-firing a `pull_request` CI run
# (a GITHUB_TOKEN push does NOT auto-trigger CI, and a workflow_dispatch run
# does NOT count toward a PR's required-status-check gate — see the
# `revalidate` job below for the full story). We close+reopen the PR so the
# `reopened` pull_request event re-runs the required checks against the fresh
# baselines — and then we CHECK THAT IT WORKED, because measured on 2026-08-15
# it does not always (2 of 3, #1694). The verification, the retry and the loud
# failure all live in scripts/vrt-revalidate-gate.mjs.
#
# ⚠ SCOPE IT. THE CAPTURE IS ONE UNSHARDED JOB over the whole FULL_MATCH spec
# set, and MEASURED on 2026-08-17 that is 41-56 min unscoped against ~3 min with
# a `grep` (#1795). `task vrt:commit` now DERIVES the token from the branch's
# diff and dispatches with it; a full sweep is `ALL=1 task vrt:commit`, i.e. a
# choice rather than the default. Sharding this job is the other half and is
# deliberately NOT done here (#1824): a half-working fan-in that dropped
# baselines would be far worse than a slow capture.
#
# Usage:  gh workflow run vrt-update.yml -f ref=<branch> [-f grep=<token>]
name: VRT update baselines

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to regenerate VRT baselines for
        required: true
        type: string
      grep:
        description: SINGLE token ([A-Za-z0-9_.-]+) scoping the capture to matching cards; empty = full sweep (41-56 min)
        required: false
        default: ''
        type: string

permissions:
  contents: write        # commit + push regenerated baselines back to the branch
  pull-requests: write   # close+reopen the PR to re-fire pull_request CI (revalidate job)

concurrency:
  group: vrt-update-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The capture. Runs the FULL_MATCH sweep with --update-snapshots=all (see the
  # long note on `vrt:update` in Taskfile.yml — `=changed` could not refresh a
  # baseline that PASSES, which is how an all-black `face-outlines-dock` stayed
  # pinned from 740bac121 onward) and commits the regenerated
  # e2e/vrt/__screenshots__/ PNGs. `=all` skips the baseline comparison entirely
  # and rewrites on a BYTE difference, so an unchanged scene is still not
  # rewritten and the bot's commit stays the set of scenes that actually moved.
  #
  # It used to say "mirrors the ci.yml `vrt` job (postgres service container)".
  # That job was deleted 2026-08-17, and the mirroring is what put a database in
  # here that nothing ever read — see the NO DATABASE note below (#1828).
  # ---------------------------------------------------------------------------
  capture:
    name: regenerate VRT baselines (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # ⚠ fail-fast MUST stay false. A shard that dies still leaves the other
      # five shards' baselines, and discarding an hour of correct rendering
      # because one scene was slow is the exact behaviour this replaces.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # 40 -> 75 (2026-08-10). MEASURED, not padded: with the platform dimension
    # collapsed every scene runs on linux, so the sweep went from ~151 executed
    # tests to 297. The first capture at 40 min was KILLED at test 241 of 297
    # having written ~146 baselines it never got to commit (run 31450544563;
    # GitHub reports a timeout-minutes kill as `cancelled`, not `failure`, which
    # is why it did not look like a timeout). Rate: 241 tests in 36.8 min of
    # Playwright = 9.2 s/test, so 297 tests ~= 45.5 min + ~3.5 min of
    # checkout/npm/DSP setup ~= 49 min. 75 leaves ~50 % headroom for a slow
    # runner. On-demand workflow: this costs zero per-PR wall time.
    #
    # ⚠ 75 -> 115 (2026-08-22, #2108), AND THE SAME ARITHMETIC AS ABOVE SAYS SO.
    # The rate never changed; the population did. At 9.2 s/test the sweep grew
    # from 297 tests (~49 min, which 75 covered with ~50 % headroom) to 467
    # committed baselines: 467 x 9.2 s = 71.6 min + ~3.5 min setup = 75.1 min of
    # WORK against a 75 min ceiling. batch-22 G3's capture was killed at exactly
    # 75:00 twice, and — as the note above already warned — both kills reported
    # as `cancelled`, so neither looked like a timeout.
    #
    # 115 restores the SAME 1.5x headroom the 40 -> 75 bump chose, computed
    # rather than picked: 75.1 x 1.5 = 112.7, rounded up.
    #
    # ⚠ AND THE NUMBER IS NO LONGER ALONE. This is the THIRD time a fixed budget
    # has been outgrown by the faceplate programme (#2039 shard count, #2103
    # cost artifact + 6 -> 8 shards, now this), and #2103's matrix comment
    # records the trigger: on a third occurrence, AUTOMATE rather than bump. So
    # this requirement is no longer gated by a committed forecast (deleted 2026-08-23) —
    # COMMITTED BASELINE COUNT and reddens in the fast unit lane the moment a
    # face batch outgrows the ceiling — minutes after the face lands, instead of
    # an hour into a capture that dies without evidence.
    #
    # ⚠ 115 -> 125 (2026-08-22, batch-22 G3), AND THE DERIVED GATE IS WHAT SAID SO
    # — which is the point of having built it. G3's eight baselines took the
    # committed population to 479, and 479 x 9.2 s = 73.5 min + 3.5 min setup =
    # 76.9 min of work, x1.5 = 115.4 against a 115 ceiling. It reddened in the
    # fast unit lane on the PR that caused it, minutes after the baselines
    # landed, instead of cancelling a capture an hour in. Nothing was measured
    # again: the rate, the setup cost and the 1.5x are unchanged and the
    # population moved.
    #
    # 125 is sized to the SAME formula against a population of ~520 rather than
    # to today's 479 — ((520 x 9.2)/60 + 3.5) x 1.5 = 124.9, rounded up. Sizing
    # to 116 (the minimum that clears 115.4) would satisfy the gate and be eaten
    # by the very next batch: at 1.5x, each baseline costs 0.23 min of ceiling,
    # so a four-face batch is ~1.8 min. The third-occurrence trigger asked for
    # automation over repeated bumps; the automation exists now, so the honest
    # companion to it is a ceiling with real room rather than one that re-reddens
    # every fortnight.
    #
    # ⚠ A SECOND LANE DERIVED THE SAME 125 INDEPENDENTLY. batch-22 G4 hit this
    # same gate on its own eight baselines, ran the same formula, and rejected
    # the minimum bump for the same reason (116 holds ZERO further batches).
    # Two lanes reaching an identical ceiling from the same derivation, without
    # coordinating, is the strongest evidence available that the number is
    # computed rather than picked — and it is why the consolidation kept ONE
    # comment instead of both.
    # ── THE CEILING IS NOW PER SHARD, WHICH ENDS THE TREADMILL (#2249) ─────
    #
    # This number has been re-derived three times — 40 -> 75 -> 125 — always by
    # the same formula against a population that keeps growing (297 -> 467 ->
    # 479, sized to 520). Each bump was correct and each was overtaken. The
    # comment above already recorded that the third occurrence "asked for
    # automation over repeated bumps".
    #
    # 125 has now been overtaken too. `task vrt:commit` reports 584 tests, so
    # ((584 x 9.2)/60 + 3.5) x 1.5 = 139.7 min against a 125 ceiling — and two
    # full sweeps died on it on 2026-08-27/28 (runs 33129822198 at 2 h 05 m and
    # 33164753035 at 79+ min), committing ZERO baselines each time. A timeout
    # kill is reported as `cancelled`, so neither looked like what it was.
    #
    # A per-shard ceiling does not have to be re-derived when the corpus grows:
    # 584 / 6 ~= 97 tests x 9.2 s ~= 15 min + 3.5 min setup ~= 19 min, and 45 is
    # ~2.4x that. When the corpus outgrows THAT, the answer is another shard —
    # a matrix entry — not another archaeology session over one number.
    timeout-minutes: 45
    # ── NO DATABASE. THE CAPTURE NEVER TOUCHED ONE (#1828) ────────────────────
    #
    # This job used to declare `services: postgres:17` — bare Docker Hub, not
    # even the mirror every other lane had moved to — plus an `Apply DB schema`
    # step. Both were copied when the workflow was written (#549: "mirrors the
    # ci.yml `vrt` job (postgres service container)"), and that ci.yml `vrt` job
    # was itself deleted 2026-08-17. Nothing here ever read the database.
    #
    # CHECKED, not assumed, because the capture boots the whole app:
    #   * Every `goto` in the e2e/vrt tree resolves to `/` or `/rack[?…]` —
    #     no /dashboard, no /r/[id], no /api.
    #   * `routes/rack/+page.ts` sets `ssr = false`, so /rack has NO server load
    #     at all; `routes/+page.ts` sets `prerender = true` and reads no auth.
    #   * The root `+layout.server.ts` calls only `readHomeAuth` (Clerk cookies).
    #     `hooks.server.ts` reads no DB. The only DATABASE_URL consumers are
    #     lib/server/db.ts (reached solely from /api + /dashboard + /r/) and
    #     packages/server.
    #   * vrt.config.ts's webServer is `vite dev` ALONE — the Hocuspocus relay,
    #     the other DATABASE_URL consumer, is never started in this lane.
    #   * The one `/api/*` request in the tree (interactions.spec.ts →
    #     /api/saved-groups) is `page.route`-stubbed and never reaches a server.
    #   * POSITIVE CONTROL, running today: ci.yml's REQUIRED `vrt-strict-shard`
    #     runs vrt.spec.ts + workflow-shell-faces.spec.ts against those same
    #     routes with no postgres and no schema step, and is green every run.
    #
    # So this deletes an image pull, a container start and a schema apply — and
    # with them A WHOLE FAILURE MODE — from the repo's ONLY baseline author: the
    # job whose failure costs 45-55 min and, per #1810, currently discards every
    # good baseline in the run.
    #
    # ⚠ IF A FULL_MATCH SPEC EVER VISITS /r/, /dashboard OR /api FOR REAL, this
    # job needs the DB back — as a STEP (`.github/scripts/start-postgres.sh`),
    # never a `services:` block. scripts/ci-service-container-pull.test.ts is
    # what makes that non-optional.
    steps:
      - name: Checkout ${{ inputs.ref }} (LFS for VRT baseline PNGs)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: true
          # ── OPTIONAL: the direct fix for #1694, if the owner wants it ──────
          # A push made with the default GITHUB_TOKEN fires NO
          # `pull_request: synchronize` (GitHub's recursion guard), which is the
          # root of the deadlock. A push made with a PAT or a GitHub App
          # installation token DOES, so the PR gets a normal CI run with no
          # close+reopen, no churn and no event-delivery race.
          #
          # ⚠ NOTHING IS BROKEN WHEN THE SECRET DOES NOT EXIST. An undefined
          # secret expands to the empty string, so this falls back to
          # `github.token` and the workflow behaves exactly as it does today —
          # the `revalidate` job below is what makes that fallback SAFE rather
          # than silent. To take the upgrade, add a repo secret
          # `VRT_BASELINE_PUSH_TOKEN`:
          #   · fine-grained PAT on this repo — Contents: read+write
          #     (the push) and Pull requests: read+write (revalidate's fallback)
          #   · or a GitHub App installation token with the same two scopes
          #     (preferred: App tokens do not expire out from under the pipeline
          #     the way a PAT does, and #1694 is exactly what an expiry looks
          #     like — a silent return to the broken behaviour)
          # Either way `revalidate` still verifies, so an expired or revoked
          # token surfaces as a RED run and not as a deadlocked PR.
          token: ${{ secrets.VRT_BASELINE_PUSH_TOKEN || github.token }}

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Cache npm + Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install workspace deps + Playwright Chromium
        run: flox activate -- task setup

      - name: Cache DOOM WASM artifact
        id: cache-doom-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/web/static/doom/doom.js
            packages/web/static/doom/doom.wasm
          key: ${{ runner.os }}-doom-wasm-${{ hashFiles('packages/web/native/build-doom-wasm.sh', 'packages/web/native/doomgeneric/**') }}

      - name: Build DOOM WASM (emcc)
        if: steps.cache-doom-wasm.outputs.cache-hit != 'true'
        run: flox activate -- bash packages/web/native/build-doom-wasm.sh

      # ── THE vrt:update DEPS THE DIRECT PLAYWRIGHT CALL NO LONGER PULLS IN ──
      #
      # #2250 switched the capture from `task vrt:update` to invoking Playwright
      # directly (the Taskfile's unquoted CLI_ARGS join mangles the planner's
      # alternation grep — see the run step below). That reasoning was right and
      # is kept; what it silently dropped was the task's dependency chain,
      # `deps: [dsp:build, test:emit-manifest]`. Without dsp:build there is no
      # packages/dsp/dist, the web app's SSR module graph fails on
      # `@patchtogether.live/dsp/dist/*.js?url`, the dev server 500s every
      # request, and ALL SIX shards die in Playwright's 120s webServer wait —
      # run 33193474728, first sharded capture, zero baselines. `status:` in
      # dsp:build makes this a no-op when a matching dist is already on disk.
      - name: Build DSP worklets + emit test manifest (vrt:update's deps)
        run: flox activate -- task dsp:build test:emit-manifest

      # ── SAY WHAT THIS RUN WILL COST, BEFORE IT COSTS IT (#1795) ───────────
      #
      # Three jobs in one cheap step (~1 min: one registry-manifest emit plus a
      # browserless `playwright --list`):
      #
      #   1. REFUSE A MANGLED TOKEN. `task vrt:update -- --grep "$GREP"` puts
      #      the value through go-task's UNQUOTED CLI_ARGS join, so a space or a
      #      `|` is word-split into something else — most likely a capture with
      #      no grep at all, silently rewriting every baseline. A dispatch can
      #      come from any `gh workflow run`, so the check lives HERE and not
      #      only in the Taskfile.
      #   2. REFUSE A GREP THAT SELECTS NOTHING. A capture that renders nothing
      #      commits nothing and SUCCEEDS, which is indistinguishable from a
      #      capture that ran and found no drift (#1809 lost a round trip to
      #      exactly that ambiguity). A typo'd token is caught here instead of
      #      45 minutes later.
      #   3. STATE THE SCOPE in the job summary, so "what did this capture even
      #      look at" is answered on the run page rather than reconstructed.
      - name: Resolve capture scope (refuse a mangled or empty grep)
        env:
          GREP: ${{ inputs.grep }}
        run: flox activate -- node scripts/vrt-scope.mjs check --grep "$GREP"

      # ── PLAN ────────────────────────────────────────────────────────────
      #
      # The dispatcher's `grep` narrows the CORPUS; the planner then PARTITIONS
      # whatever that leaves. Composing them in that order is what keeps a
      # scoped capture scoped — every shard grep is derived from the
      # already-filtered list, so no shard can reach outside the request.
      #
      # `scripts/vrt-shard-plan.mjs` is the planner the REQUIRED
      # `vrt-strict-shard` lane already uses. Its timings artifact covers only
      # the strict subset, so most of THIS corpus is unmeasured and takes the
      # median cost: balance is approximate. Correctness is not — the planner
      # THROWS if its output is not a partition of what was discovered, so a bad
      # plan is slow, never incomplete. That distinction is the whole reason a
      # capture may be sharded at all.
      - name: Plan this shard's scenes (cost-based, union-asserted)
        env:
          GREP: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            flox activate -- npx --workspace e2e playwright test \
              --config=vrt/vrt.config.ts --list --reporter=json --grep "$GREP" > vrt-capture-list.json
          else
            flox activate -- npx --workspace e2e playwright test \
              --config=vrt/vrt.config.ts --list --reporter=json > vrt-capture-list.json
          fi
          # --allow-empty: a scoped dispatch can select fewer scenes than the
          # matrix has shards (run 33198943725: grep=mirrorpool → 4 tests ÷ 6
          # shards killed every shard on the planner's no-empty-shard throw).
          # Here an empty shard is an idle worker, not dropped coverage — the
          # run step below skips Playwright entirely on an empty grep. The
          # REQUIRED vrt-strict lane does NOT pass this flag.
          flox activate -- node scripts/vrt-shard-plan.mjs ${{ matrix.shard }} 6 --allow-empty \
            --list vrt-capture-list.json --out vrt-capture-planned.txt > vrt-capture-grep.txt
          echo "shard ${{ matrix.shard }}/6 plans $(wc -l < vrt-capture-planned.txt) scenes"

      # ⚠ Playwright DIRECTLY, not `task vrt:update`. The Taskfile joins
      # {{.CLI_ARGS}} unquoted and this grep is an alternation full of spaces,
      # `|`, `(`, `)` and `$` — word-splitting it yields a grep matching FEWER
      # tests, i.e. a green shard that rendered nothing. Same reasoning the
      # vrt-strict-shard lane records for the identical call.
      #
      # `--update-snapshots=changed` is spelled here, never bare (bare means
      # `=all` in Playwright 1.59 and has rewritten 22 unrelated baselines once)
      # and never in e2e/package.json, which is a TOOLCHAIN_PIN_FILE in the
      # WebGL attest basis and is hashed WHOLE.
      - name: Regenerate VRT baselines (shard ${{ matrix.shard }}/6)
        run: |
          set -euo pipefail
          GREP="$(cat vrt-capture-grep.txt)"
          if [ -z "$GREP" ]; then
            echo "shard ${{ matrix.shard }}/6: no scenes in scope — idle worker, skipping capture."
            exit 0
          fi
          flox activate -- npx --workspace e2e playwright test \
            --config=vrt/vrt.config.ts --update-snapshots=changed --grep "$GREP"

      # UPLOAD, don't commit. Six shards pushing to one branch would race and
      # the losers' baselines would vanish silently, so the shards PRODUCE and
      # exactly one job COMMITS.
      - name: Upload this shard's baselines
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines-shard-${{ matrix.shard }}
          path: e2e/vrt/__screenshots__
          retention-days: 1
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The collector — ONE commit, from whatever the shards produced.
  #
  # `if: always()` beside `fail-fast: false` is deliberate: a capture where five
  # of six shards succeeded should land those five shards' work. The
  # all-or-nothing alternative is what threw away an hour of correct rendering
  # every time one scene ran long, and a missing shard is not silent — its
  # baselines simply stay stale and `vrt-strict` keeps naming them.
  # ---------------------------------------------------------------------------
  collect:
    name: commit VRT baselines
    needs: capture
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout ${{ inputs.ref }} (LFS for VRT baseline PNGs)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
          persist-credentials: true

      - name: Install Flox
        uses: flox/install-flox-action@v2

      # `merge-multiple` is safe BECAUSE the planner asserts a partition: two
      # shards can never have rendered the same scene, so no download can
      # clobber another shard's PNG.
      - name: Download every shard's baselines
        uses: actions/download-artifact@v4
        with:
          pattern: vrt-baselines-shard-*
          merge-multiple: true
          path: e2e/vrt/__screenshots__

      - name: Report what arrived
        run: |
          echo "changed baseline files: $(git status --porcelain e2e/vrt/__screenshots__ | wc -l | tr -d ' ')"
          git status --short e2e/vrt/__screenshots__ | head -40

      - name: Commit + push baselines
        id: commit
        run: flox activate -- bash .github/scripts/vrt-commit-baselines.sh "${{ inputs.ref }}"

  # ---------------------------------------------------------------------------
  # Re-validate: the baseline commit was pushed by GITHUB_TOKEN, which does NOT
  # fire `push`/`pull_request` — so the PR's required VRT check never re-runs
  # against the fresh baselines on its own.
  #
  # We CANNOT fix this with `gh workflow run ci.yml --ref <branch>`
  # (workflow_dispatch). CONFIRMED on PR #524: GitHub does NOT credit
  # workflow_dispatch-produced check-runs to a PR's required-status-check merge
  # gate. The ruleset keeps reporting "required status checks are expected" even
  # though the dispatched run is green, and even `gh pr merge --admin` is
  # refused. Required checks are only counted from a `pull_request` (or push)
  # event for the PR's head SHA.
  #
  # FIX: re-trigger a `pull_request` run by close+reopen of the PR for this
  # branch. The `reopened` action fires a `pull_request` event → ci.yml runs
  # under that event → its check-runs DO count toward the required-status gate.
  # GH_TOKEN (the workflow GITHUB_TOKEN) can close/reopen a PR; this does NOT
  # touch the commits, only re-fires the event. No-open-PR is handled gracefully
  # (the baselines are already pushed; whoever opens the PR later gets a normal
  # pull_request run).
  #
  # ── ⚠ …AND THAT FIX IS NOT RELIABLE. IT ALSO REPORTED SUCCESS EITHER WAY ───
  # #1694. Every dispatch on 2026-08-15 that actually reached the close+reopen:
  #
  #     PR #1677  closed 14:06:51.9 → reopened 14:06:53.1 → ci.yml run 14:06:54 ✓
  #     PR #1689  closed 18:04:18   → reopened 18:04:19   → ci.yml run 18:04:22 ✓
  #     PR #1692  closed 18:21:51.7 → reopened 18:21:53.3 → NO RUN AT ALL       ✗
  #
  # #1692's reopen produced no run of ANY workflow on that branch — not CI, not
  # Deploy — so it is event delivery, not a path filter, and
  # `.../actions/runs?head_sha=d2bbfd4c0` returned total_count 0. The PR sat
  # BLOCKED with one check and zero failures until a human pushed a merge commit
  # on top. The step below reported SUCCESS for that run, because it never
  # looked at whether the run it asked for exists.
  #
  # So the step is now SELF-VERIFYING: after each re-fire it polls the runs API
  # — "did GitHub start a ci.yml run for this head SHA?" — retries the re-fire
  # while the budget lasts, and FAILS
  # LOUDLY (red run + a PR comment naming the remedy) when the run never
  # appears. It never posts a status and never marks anything green: the only
  # thing that can satisfy a required context here is a real `pull_request` CI
  # run. Logic + negative controls: scripts/vrt-revalidate-gate{.mjs,.test.ts}.
  #
  # ── ⚠ …AND "A RUN EXISTS" WAS STILL THE WRONG QUESTION (#1815) ─────────
  # A run held for approval reports `status: completed, conclusion:
  # action_required` — a completed run, with a conclusion, that executed
  # NOTHING. It satisfied "exists" cleanly, so this step went green over a PR
  # with ZERO check runs. Measured 2026-08-17 on head ad27705c…: ci.yml runs
  # for the SHA = 1, check-runs on the commit = 0. The two traces this job's
  # header cited as proof the re-fire works (c2c9c27eb, 022c6cc23) were BOTH
  # parked on attempt 1 and only ran because a human approved them ~25 min
  # later — the "✓" measured run CREATION and was read as EXECUTION.
  #
  # The verification now classifies the run's state and only accepts one that
  # executed or will; a parked run is APPROVED via the REST endpoint and
  # re-verified. ⚠ Root cause, unfixed here (#1816): every pull_request run whose
  # actor is github-actions[bot] is parked on attempt 1 in this repo, so this
  # fires on every capture. Setting VRT_BASELINE_PUSH_TOKEN (already wired below,
  # absent today) makes the push a real account's and retires the whole class.
  #
  # ⚠ The oracle filters on `event=pull_request`, where G2 deliberately does
  # not. There, presence means REFUSE THE BYPASS, so over-counting is safe;
  # here presence means DECLARE SUCCESS, so the safe direction is the opposite
  # and a workflow_dispatch run (which does not count toward the gate — #524)
  # must not be mistaken for one that does.
  #
  # ── THE `if:` IS STILL LOAD-BEARING, FOR ONE REASON NOW ────────────────
  # A capture that rewrote NOTHING still SUCCEEDS — Playwright only rewrites a
  # snapshot whose comparison FAILS — so `needs: capture` alone would
  # close+reopen the PR and burn ~25 min of CI on a branch whose baselines did
  # not move. `capture.outputs.pushed` is what tells "captured" from "ran and
  # changed nothing".
  #
  # ⚠ AND THE HAZARD THAT USED TO LIVE HERE IS GONE WITH THE MATRIX, not fixed.
  # `needs: [linux, darwin]` with no `if:` defaults to `success()`, and GitHub
  # PROPAGATES a skipped dependency — so with two platform jobs each carrying
  # their own `if:`, a single-platform dispatch (the one CLAUDE.md recommended,
  # to save the redundant runner) skipped the other job and therefore skipped
  # revalidate, silently, on a green run. The documented close+reopen was
  # notional for every single-platform capture between 2026-06 and 2026-08-03.
  # With ONE capture job there is no sibling to skip and no propagation to
  # reason about: the defect was deleted along with the dimension that created
  # it, which is strictly better than the `always() && …` patch that was
  # standing in for it.
  #
  # Guarded by scripts/vrt-update-revalidate.test.ts, which simulates GitHub's
  # skip propagation over the real YAML.
  # ---------------------------------------------------------------------------
  revalidate:
    name: re-validate CI on ${{ inputs.ref }} (re-fire + VERIFY)
    runs-on: ubuntu-latest
    needs: collect
    if: ${{ needs.collect.outputs.pushed == 'true' }}
    # Bounds the failure; the gate is the verdict, never the clock. The loop's
    # own budget (MAX_REFIRES × POLLS_PER_ACTION × POLL_INTERVAL_MS, plus
    # MAX_APPROVALS; defaults in scripts/vrt-revalidate-gate.mjs) is well inside
    # this.
    timeout-minutes: 10
    permissions:
      contents: read         # checkout, for scripts/vrt-revalidate-gate.mjs
      # write, not read (#1815): the gate must both READ the run's state and
      # APPROVE it when GitHub parked it at `action_required`. Every
      # github-actions[bot]-triggered pull_request run in this repo is parked on
      # attempt 1, so without this the verification can only ever report the
      # deadlock it is standing in.
      actions: write
      pull-requests: write   # close + reopen to re-fire; comment on a deadlock
    steps:
      # Only the one script is needed, so no LFS and no baselines.
      #
      # The default ref is `github.sha` — the SAME commit this workflow file was
      # read from. That is what we want and it is worth stating: `task
      # vrt:commit` dispatches with `--ref <branch>`, so a branch that predates
      # #1694 runs its OWN (unverified) workflow with its own absent script,
      # and a rebased branch runs the new workflow with the new script. The two
      # can never be mismatched, because they arrive together.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ⚠ VERIFY A RUN **RAN** — not that one exists (#1815). A run parked at
      # `conclusion: action_required` is a completed run with a conclusion, so
      # "exists" was satisfied by a run that executed nothing and the PR sat at
      # zero check runs. The gate now classifies the run's state, approves a
      # parked one through POST /actions/runs/{id}/approve, and fails loudly
      # with the state printed when it cannot.
      #
      # ⚠ NEVER `gh run approve` — it is not a subcommand: it prints `gh run`'s
      # usage and EXITS 0, so a shell step built on it looks green and does
      # nothing. Asserted in scripts/vrt-revalidate-gate.test.ts.
      #
      # The token falls back exactly like the capture job's: with
      # VRT_BASELINE_PUSH_TOKEN present the re-fire and the approval are made by
      # a real account (and the push itself no longer produces a parked run at
      # all — that is the root fix); absent, GITHUB_TOKEN + `actions: write`.
      - name: Re-fire pull_request and VERIFY a ci.yml run RAN (approve if parked)
        env:
          GH_TOKEN: ${{ secrets.VRT_BASELINE_PUSH_TOKEN || github.token }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
          PUSHED_SHA: ${{ needs.collect.outputs.sha }}
        run: node scripts/vrt-revalidate-gate.mjs verify
