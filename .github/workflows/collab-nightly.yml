# collab-nightly — the daily FULL-@collab backstop, SHARDED so it completes.
#
# WHY this exists: the per-PR `collab` job downloads CACHED artifacts (WASM +
# preview bundle), so build-script rot + relay/DB infra drift can hide there.
# This scheduled job runs the FULL real @collab lane on CI every day, built FROM
# SCRATCH, so those surface daily off the PR critical path. (It used to be the
# backstop for `collab-attest`, the cheap per-PR content-hash VERIFY; that job
# was deleted 2026-08-17 with the rest of the non-gating lanes.)
#
# ⚠ THIS IS A BACKSTOP, NOT A GATE, AND IT RUNS TOO LATE TO BE ONE. The cron
# below fires at 09:00 UTC; daily-prod-deploy.yml fires at 04:00 UTC. A
# multiplayer regression that lands on main therefore reaches PRODUCTION five
# hours before this workflow looks at it. That gap is precisely why ci.yml's
# per-PR `collab` job survived the 2026-08-17 deletion of every other
# non-gating lane — it is the only multiplayer signal that runs before a merge.
#
# ⚠ ROOT CAUSE OF THE 40/40 TIMEOUT-CANCEL STREAK (#1500, fixed 2026-08-13):
# this workflow's inline `task build:web` was missing `VITE_E2E_HOOKS: '1'`
# (ci.yml's build-web sets it; this file was born without it, #798), so every
# nightly bundle had the `__attachProvider`/`__ensureEngine` test hooks
# TREE-SHAKEN OUT. Every @collab spec then hung its full 120 s test budget in
# `waitForFunction(() => typeof window.__attachProvider === 'function')` (+ one
# retry = ~4 min/spec), so every shard needed ~52+ min of pure timeouts and the
# 30-min ceiling killed all four, every night — conclusion `cancelled`, which
# `if: failure()` on the alert never saw. Measured on run 31686747477
# (2026-08-13): setup ≈ 4m20s/shard with warm caches, then 26+ min of hangs in
# the test step on ALL FOUR shards; the same specs, same grep, same --workers=1
# took 4m28s TOTAL (unsharded) in ci.yml's collab job the same day. The
# workflow never once ran green from birth (2026-06-15) to the fix.
#
# WHY SHARDED (FIX 2026-06-29): run-step timing on the validation run
# (28381443028) showed the inline builds finish in ~3 min but the SERIAL
# @collab lane itself ran 57+ min and was cancelled at the ceiling. ⚠ That
# 57-min figure was measured on a hook-less bundle (see above), so it was
# ~all per-spec timeout, not genuine spec cost — the true serial lane is
# ~4.5 min (ci.yml collab job, 2026-08-13). Sharding is KEPT anyway: 4-way
# split + per-shard relay/DB isolation keeps each shard's test phase ~1-2 min,
# so the 30-min ceiling is honest headroom, and a shard that hits it again is
# a genuinely-hung spec to fix (the `alert` job surfaces it), not a ceiling to
# raise. (--workers=2 was ALSO wrong: the relay is a single in-memory process
# and deadlocks at >1 — the #97 flake. --workers=1 stays.)
#
# DIAGNOSTIC backstop, NOT a per-PR gate: a red shard is a signal to investigate
# (and re-attest after a fix), not a merge blocker.
#
# Dispatch manually any time:  gh workflow run collab-nightly.yml --ref <branch>
name: collab-nightly

on:
  schedule:
    # 09:00 UTC daily (off-peak; clear of typical PR-CI bursts).
    - cron: '0 9 * * *'
  workflow_dispatch: {}

# Never let two nightly runs (or a nightly + a manual re-dispatch) collide.
concurrency:
  group: collab-nightly
  cancel-in-progress: false

permissions:
  contents: read
  # The `alert` job opens a GH issue when any shard fails — that issue creation
  # emails repo watchers (incl. tmayshark@gmail.com), mirroring live-smoke-alert.
  # Without it the lane rotted red for days UNALERTED (the gap this closes).
  issues: write

jobs:
  collab-shard:
    name: collab-nightly (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # FAIL-FAST ceiling per shard: ~1/4 of the serial lane (~15 min) + inline
    # builds (~3 min, cached) + setup. A shard that hits 30 min has a genuinely
    # hung spec — fix it (the alert surfaces which), don't raise this.
    timeout-minutes: 30
    strategy:
      # One slow/red shard must NOT cancel the others — we want the full picture.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        # AWS ECR Public mirror — avoids the flaky Docker Hub service-container
        # pull (same image the ci.yml collab/unit jobs use).
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patchtogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patchtogether_test
      # Opt the COLLAB_JOB-gated @collab DOOM specs IN (same as the ci.yml collab
      # job) — they are the heavy specs this nightly exists to exercise.
      COLLAB_JOB: '1'
      # Run @collab against `vite preview` (built bundle), not the dev server —
      # kills the HMR-reload flake class (#232/#225). Requires a web build below.
      E2E_USE_PREVIEW: '1'

    steps:
      - name: Checkout (lfs for the SM64 bundle the preview build bakes in)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Cache npm + Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache .svelte-kit
        uses: actions/cache@v4
        with:
          path: packages/web/.svelte-kit
          key: ${{ runner.os }}-svelte-kit-${{ hashFiles('packages/web/svelte.config.js', 'packages/web/src/routes/**', 'packages/web/package.json') }}

      - name: Install workspace deps + Playwright Chromium
        run: flox activate -- task setup

      - name: Apply DB schema
        run: flox activate -- scripts/apply-db-schema.sh "$DATABASE_URL"

      # --- Build artifacts inline (this workflow is off the ci.yml job graph) ---

      - name: Build DSP worklets (Faust + esbuild)
        run: flox activate -- task dsp:build

      - name: Cache DOOM WASM artifact
        id: cache-doom-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/web/static/doom/doom.js
            packages/web/static/doom/doom.wasm
          key: ${{ runner.os }}-doom-wasm-${{ hashFiles('packages/web/native/build-doom-wasm.sh', 'packages/web/native/doomgeneric/**') }}

      - name: Build DOOM WASM (emcc)
        if: steps.cache-doom-wasm.outputs.cache-hit != 'true'
        run: flox activate -- bash packages/web/native/build-doom-wasm.sh

      - name: Cache DOOM1.WAD (shareware)
        id: cache-doom-wad
        uses: actions/cache@v4
        with:
          path: packages/web/static/doom/DOOM1.WAD
          key: doom-wad-shareware-v1

      - name: Download DOOM1.WAD (shareware)
        if: steps.cache-doom-wad.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
            -o packages/web/static/doom/DOOM1.WAD \
            https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad
          echo "5b2e249b9c5133ec987b3ea77596381dc0d6bc1d  packages/web/static/doom/DOOM1.WAD" \
            | shasum -a 1 -c -

      - name: Emit registry manifest for E2E
        run: flox activate -- task test:emit-manifest

      # VITE_E2E_HOOKS=1 is REQUIRED at BUILD time (it is a Vite build-time
      # var, baked into the bundle): the @collab helpers drive the app through
      # `window.__attachProvider` / `__ensureEngine` / `__patch`, and those
      # hooks are TREE-SHAKEN OUT of a prod bundle without it
      # (packages/web/src/lib/dev/test-hooks.ts; same flag ci.yml's build-web
      # and Taskfile e2e:serve set, for the same reason). Its absence here was
      # the #1500 root cause — every spec hung waiting for the hook, every
      # shard hit the 30-min ceiling, every night, from this file's birth.
      - name: Build web (preview bundle, test hooks enabled)
        env:
          VITE_E2E_HOOKS: '1'
        run: flox activate -- task build:web

      # --- One shard of the full real @collab lane (serial within the shard) ---
      # Same grep + --workers=1 as the ci.yml `collab` job; `--shard=i/4` runs
      # only this shard's quarter of the spec list, so the shard fits the ceiling.
      # --workers=1 keeps the single-process relay from deadlocking (#97).
      - name: Run @collab lane (shard ${{ matrix.shard }}/4, serial, html report)
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          flox activate -- npx --workspace e2e playwright test \
            --grep "@collab|@capacity" \
            --shard=${{ matrix.shard }}/4 \
            --workers=1 \
            --reporter=list,html

      - name: Upload Playwright HTML report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collab-nightly-playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 30

      - name: Upload Playwright test-results on failure (shard ${{ matrix.shard }})
        # `failure() || cancelled()`: a per-shard timeout-ceiling kill can register
        # as `cancelled`, NOT `failure` — upload on both so a hung shard still
        # leaves diagnostics.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: collab-nightly-test-results-${{ matrix.shard }}
          path: e2e/test-results
          retention-days: 14

  # --- Failure notification ------------------------------------------------
  # Runs after ALL shards. `if: !success()` fires when ANY shard did NOT end
  # green — failed OR ceiling-cancelled. Opens/refreshes a single GH issue
  # (emails repo watchers), so a red OR HUNG nightly surfaces the same day
  # instead of rotting unalerted.
  #
  # ⚠ WHY NOT `failure()` (the #1500 defect): a job killed by its own
  # `timeout-minutes` concludes `cancelled`, not `failure`, so `if: failure()`
  # is STRUCTURALLY BLIND to the hung-shard case — the exact case a nightly
  # backstop most needs to scream about. 40+ consecutive timeout-cancelled
  # nights alerted zero times. Cancellation semantics differ per job and each
  # choice here is deliberate (the cancellation-`if:` family):
  #   - ci.yml merge-reports: `!cancelled()` — a cancelled run is NOT a signal
  #     there; running anyway posted a false RED against a green SHA (#1581).
  #   - vrt-strict aggregator: `always()` + explicit exit 1 — fail-closed
  #     gate; it must report even when siblings fall over.
  #   - THIS job: `!success()` — an ALERT for a diagnostic lane whose primary
  #     observed failure mode IS the timeout-cancel. Anything other than all
  #     shards green (failure, ceiling-cancel, or a skipped/cancelled shard)
  #     must page. A human run-level cancel stops queued jobs before their
  #     `if:` is evaluated, so it cannot false-page this.
  alert:
    name: collab-nightly alert (any shard not green)
    runs-on: ubuntu-latest
    needs: collab-shard
    if: ${{ !success() }}
    steps:
      - name: Alert on nightly failure (open/refresh a GH issue)
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'collab-nightly-failure';
            const dateUtc = new Date().toISOString().slice(0, 10);
            const body = [
              '**collab-nightly: one or more shards failed (or hit the per-shard ceiling).**',
              '',
              'Daily FULL-@collab backstop (`--grep @collab|@capacity`, `--workers=1`,',
              'sharded `--shard=i/4`). A red shard is a SIGNAL to investigate a',
              'multiplayer/relay regression + re-attest — it is not a per-PR merge',
              'blocker, but it must not rot unalerted.',
              '',
              `**Run:** ${runUrl}`,
              `**SHA:** ${context.sha}`,
              '',
              'Diagnostics: download the per-shard `collab-nightly-test-results-<n>` +',
              '`collab-nightly-playwright-report-<n>` artifacts from the run above',
              '(read `error-context.md` / `trace.zip` — do NOT `gh run view --log-failed`).',
              '',
              'Close this issue once the nightly is green again; it is reused (not',
              're-opened) on subsequent failures while it stays open.',
            ].join('\n');
            // Reuse an already-open failure issue so consecutive red nights don't
            // spam a new issue each time — just add a dated comment.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            if (existing.data.length > 0) {
              const num = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                body: `Still failing (${dateUtc}). Run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[collab-nightly] @collab shard(s) failing (${dateUtc})`,
                body,
                labels: ['observability', 'alert', label],
              });
            }
