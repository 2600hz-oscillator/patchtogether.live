name: Chaos 24/7

# Fuzz autotest.patchtogether.live with Chaos Carl. A fresh job joins a fixed
# rackspace (CHAOS_RACKSPACE_URL secret) as an anon participant via invite link,
# runs a 1000-iteration chaos loop, and uploads the findings/ bundle as a
# workflow artifact so we can triage offline.
#
# Required repo secrets:
#   AUTOTEST_BETA_GATE_PASS  — autotest beta-gate password (reuses the secret
#                              already set for the live-smoke workflow).
#   CHAOS_RACKSPACE_URL      — invite-link URL the bot joins; e.g.
#                              https://autotest.patchtogether.live/r/<id>?invite=<code>
#
# ⚠ HOURLY -> NIGHTLY (2026-08-23, CI simplification audit). The name is kept
# because it is the workflow's identity, not a promise about the cadence.
#
# MEASURED: this was the ONLY hourly cron in the tree — 24 fires a day at ~3 min
# wall each, against a scheduled-workflow surface that otherwise consists of one
# nightly collab run, one nightly PROD deploy and the 10-minute live-smoke probe.
# The audit asked for at most one nightly hunter; this is it. The other three
# workflows people call "the flake hunters" (`e2e-flake-purge`,
# `behavioral-flake-purge`, `flake-check-3x`) turned out to have NO schedule at
# all — they are dispatch/branch-push tools and cost zero runner minutes idle, so
# they are kept unchanged.
#
# The cadence argument is the file's own, and it still holds at 1/day: findings
# persist to artifacts (90-day retention), so gaps between runs are not
# observability gaps — they are sampling cadence. 04:00 and 09:00 UTC are taken
# by the PROD deploy and the collab nightly; 02:00 keeps this off both.
#
# Log-only invariants mode is implied: CHAOS_RACKSPACE_URL flips the runner
# into "findings, not failures" (see runner.spec.ts LOG_ONLY_INVARIANTS).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per run (default 1000)'
        required: false
        default: '1000'
      seed:
        description: 'Optional fixed seed (default: time-derived)'
        required: false

concurrency:
  group: chaos-24-7
  cancel-in-progress: false

jobs:
  chaos:
    name: Chaos run against autotest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No LFS: this hourly chaos run drives the bot against the LIVE deployed
      # autotest URL (E2E_BASE_URL) — it builds nothing and reads no
      # LFS-tracked path (no `task build`, no ART/VRT baselines, no SM64
      # bundle). Skipping the LFS payload here saves the most bandwidth of any
      # single change: this fires every hour via cron.
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: flox/install-flox-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - run: flox activate -- task install
      - run: flox activate -- task install:browsers
      - name: Run chaos against autotest
        env:
          BETA_GATE_PASS: ${{ secrets.AUTOTEST_BETA_GATE_PASS }}
          CHAOS_RACKSPACE_URL: ${{ secrets.CHAOS_RACKSPACE_URL }}
          E2E_BASE_URL: https://autotest.patchtogether.live
          CHAOS_ITERATIONS: ${{ github.event.inputs.iterations || '1000' }}
          CHAOS_SEED: ${{ github.event.inputs.seed }}
          CHAOS_MAX_NODES: '5'
        run: flox activate -- task chaos:run
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-findings-${{ github.run_id }}
          path: e2e/chaos/findings/
          if-no-files-found: ignore
          retention-days: 90
